<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>動線導引 AR - 分類方向指引</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000; font-family: sans-serif;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; padding: 18px 36px; font-size: 20px; font-weight: bold;
    background: #ff2d78; color: #fff; border: none; border-radius: 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 15; color: #fff; background: rgba(0,0,0,0.55); padding: 8px 16px;
    border-radius: 20px; font-size: 14px; display: none;
  }
  #statusBox {
    position: fixed; top: 8px; left: 8px; z-index: 998;
    color: #0f0; background: rgba(0,0,0,0.6); padding: 6px 10px;
    border-radius: 8px; font-size: 12px; font-family: monospace;
  }
  #errBox {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: rgba(255,0,0,0.85); color: #fff; font-size: 12px;
    padding: 8px; display: none; white-space: pre-wrap; word-break: break-all;
  }
  video:not(.assetVideo) {
    position: fixed !important; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
    object-fit: cover; z-index: 1 !important;
  }
  canvas.mindar-canvas {
    position: fixed !important; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
    z-index: 2 !important;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<button id="startBtn">點擊開始 AR 導覽</button>
<div id="hint">請將鏡頭對準指標圖片</div>
<div id="statusBox">狀態: 尚未啟動</div>
<div id="errBox"></div>

<script>
  function showErr(msg) {
    var box = document.getElementById("errBox");
    box.style.display = "block";
    box.textContent = "錯誤: " + msg;
  }
  window.addEventListener("error", function (e) {
    showErr(e.message + " (" + e.filename + ":" + e.lineno + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = (reason && (reason.message || reason.toString())) || String(reason);
    showErr("[非同步] " + msg);
  });
</script>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

let mindarThree = null;
let started = false;

function setStatus(msg) {
  const box = document.getElementById("statusBox");
  if (box) box.textContent = "狀態: " + msg;
}

// 強制修正MindAR產生的攝影機畫面/畫布，避免任何外層容器造成的黑邊
function forceFullscreenFix() {
  function apply(el) {
    el.style.setProperty("position", "fixed", "important");
    el.style.setProperty("top", "0", "important");
    el.style.setProperty("left", "0", "important");
    el.style.setProperty("width", "100vw", "important");
    el.style.setProperty("height", "100vh", "important");
    el.style.setProperty("max-width", "none", "important");
    el.style.setProperty("max-height", "none", "important");
    el.style.setProperty("transform", "none", "important");
    el.style.setProperty("object-fit", "cover", "important");
  }
  const video = document.querySelector("video:not(.assetVideo)");
  const canvas = document.querySelector("canvas");
  if (canvas) canvas.classList.add("mindar-canvas");
  [video, canvas].forEach((el) => {
    if (!el) return;
    apply(el);
    let node = el.parentElement;
    while (node && node !== document.body) {
      node.style.setProperty("transform", "none", "important");
      node.style.setProperty("position", "static", "important");
      node.style.setProperty("width", "100%", "important");
      node.style.setProperty("height", "100%", "important");
      node.style.setProperty("max-width", "none", "important");
      node = node.parentElement;
    }
  });
}

// ---- 4個方向指標設定 ----
// x: 正值=畫面右邊，負值=畫面左邊；y: 高度；z: 深度；overlap讓箭頭視覺上互相銜接
const DIRECTIONS = [
  { file: "./wayfinding-station3-tag5.png", x: -0.55, y: 0.32, z: 0, scale: 1.0, order: 0 },
  { file: "./wayfinding-station3-tag9.png", x: 0.19, y: 0.32, z: 0, scale: 1.0, order: 3 },
  { file: "./wayfinding-station3-tag8.png", x: 0.48, y: 0.32, z: 0, scale: 0.8, order: 2 },
  { file: "./wayfinding-station3-tag0.png", x: 0.70, y: 0.32, z: 0, scale: 0.6, order: 1 },
];
const ARROW_WORLD_HEIGHT = 0.16;
const IMG_ASPECT = 760 / 280;

async function startAR() {
  if (started) return;
  started = true;

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("hint").style.display = "block";
  setStatus("初始化 MindAR...");

  mindarThree = new MindARThree({
    container: document.body,
    imageTargetSrc: "./wayfinding-station3-targets.mind",
    filterMinCF: 0.00005,
    filterBeta: 0.0005,
    uiScanning: false,
  });

  const { renderer, scene, camera } = mindarThree;
  renderer.setClearColor(0x000000, 0);

  const textureLoader = new THREE.TextureLoader();
  const textures = await Promise.all(DIRECTIONS.map((d) => textureLoader.loadAsync(d.file)));
  textures.forEach((t) => (t.colorSpace = THREE.SRGBColorSpace));

  function buildItem(cfg, texture, orderIndex) {
    const h = ARROW_WORLD_HEIGHT * (cfg.scale || 1);
    const w = h * IMG_ASPECT;
    const geometry = new THREE.PlaneGeometry(w, h);
    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false,
      depthTest: false,
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(cfg.x, cfg.y, cfg.z);
    // 越後面(0類方向)的箭頭疊在越上層，視覺上才會是「後面的壓在前面箭頭尾巴上」
    mesh.renderOrder = cfg.order;
    return { cfg, material, mesh };
  }

  const anchorIndices = [0, 1, 2]; // 這3個角度的照片都對應同一組方向指引
  const allItemGroups = [];

  const anchors = anchorIndices.map((idx) => {
    const anchor = mindarThree.addAnchor(idx);
    const items = DIRECTIONS.map((cfg, i) => buildItem(cfg, textures[i], i));
    items.forEach((item) => anchor.group.add(item.mesh));
    allItemGroups.push(items);

    anchor.onTargetFound = () => {
      document.getElementById("hint").style.display = "none";
      setStatus("已偵測到目標，顯示4個方向指引");
    };
    anchor.onTargetLost = () => {
      document.getElementById("hint").style.display = "block";
      setStatus("鏡頭運作中，掃描目標中...");
    };

    return anchor;
  });

  // ---- 閃爍前進動畫 ----
  // index 0 = 5類(常亮，不參與輪播)
  // index 1,2,3 = 9,8,0類，依序漸亮漸暗、循環播放
  const BASE_OPACITY = 0.45; // 沒輪到的箭頭，亮度降低製造更明顯的對比
  const PEAK_OPACITY = 1.0; // 輪到亮起時的最高亮度
  const PEAK_SCALE_BOOST = 0.15; // 亮起時額外放大的比例，讓效果更明顯
  const FLASH_DURATION_MS = 500; // 每個箭頭亮起的時間
  const cycleStartTime = performance.now();
  const rightArrowCount = 3; // 9,8,0
  const cycleDuration = FLASH_DURATION_MS * rightArrowCount;

  // 5類：獨立的呼吸閃動週期，不跟9/8/0共用同一個循環
  const ARROW5_BASE_OPACITY = 0.55;
  const ARROW5_PEAK_OPACITY = 1.0;
  const ARROW5_SCALE_BOOST = 0.12;
  const ARROW5_PERIOD_MS = 1000;

  function easeInOut(t) {
    // 0→1→0 的平滑漸層曲線(像正弦波)，符合「像漸層」的要求
    return Math.sin(t * Math.PI);
  }

  function updateFlash() {
    const now = performance.now();
    const elapsed = (now - cycleStartTime) % cycleDuration;
    const activeIndex = Math.floor(elapsed / FLASH_DURATION_MS); // 0,1,2 對應 9,8,0
    const localT = (elapsed % FLASH_DURATION_MS) / FLASH_DURATION_MS;
    const glow = easeInOut(localT); // 0 → 1 → 0

    const arrow5T = ((now - cycleStartTime) % ARROW5_PERIOD_MS) / ARROW5_PERIOD_MS;
    const arrow5Glow = easeInOut(arrow5T);

    allItemGroups.forEach((items) => {
      items.forEach((item, i) => {
        if (i === 0) {
          // 5類：獨立運作，持續自己的呼吸閃動，不受9/8/0影響
          item.material.opacity = ARROW5_BASE_OPACITY + (ARROW5_PEAK_OPACITY - ARROW5_BASE_OPACITY) * arrow5Glow;
          item.mesh.scale.setScalar(1.0 + ARROW5_SCALE_BOOST * arrow5Glow);
          return;
        }
        const rightIndex = i - 1; // 0,1,2 對應 9,8,0
        if (rightIndex === activeIndex) {
          item.material.opacity = BASE_OPACITY + (PEAK_OPACITY - BASE_OPACITY) * glow;
          item.mesh.scale.setScalar(1.0 + PEAK_SCALE_BOOST * glow);
          // 輪到誰亮，誰就即時疊到最上層，重疊處才會顯示該箭頭的顏色
          item.mesh.renderOrder = 10;
        } else {
          item.material.opacity = BASE_OPACITY;
          item.mesh.scale.setScalar(1.0);
          item.mesh.renderOrder = item.cfg.order;
        }
      });
    });
  }

  updateFlash(); // 先套用一次初始狀態

  try {
    await mindarThree.start();
    setStatus("鏡頭運作中，掃描目標中...");
    forceFullscreenFix();
    setTimeout(forceFullscreenFix, 300);
    setTimeout(forceFullscreenFix, 1000);
    window.addEventListener("resize", forceFullscreenFix);
    window.addEventListener("orientationchange", forceFullscreenFix);
  } catch (err) {
    showErr("[MindAR啟動失敗] " + (err && (err.message || err.toString())));
    setStatus("啟動失敗");
    document.getElementById("startBtn").style.display = "block";
    document.getElementById("hint").style.display = "none";
    started = false;
    return;
  }

  renderer.setAnimationLoop(() => {
    updateFlash();
    renderer.render(scene, camera);
  });
}


document.getElementById("startBtn").addEventListener("click", startAR);
</script>

</body>
</html>
