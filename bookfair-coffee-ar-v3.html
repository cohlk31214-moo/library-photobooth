<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>書香・茶香・咖啡香 WebAR</title>

<!--
  ============================================================
  書香・茶香・咖啡香 書展 WebAR Demo
  ------------------------------------------------------------
  技術架構：Camera → MindAR Image Tracking → Three.js AR Overlay
  - Trigger Image：《異鄉人》真實書封（內嵌為 base64，單一檔案不需外部圖檔）
  - 圖像辨識目標檔（.mind）：在瀏覽器內即時編譯產生
  - AR 內容（咖啡杯、熱氣、咖啡豆/茶葉）：全部由 Three.js 幾何體 + 程式材質生成

  函式庫：MindAR.js（mind-ar@1.1.5，UMD 版，內含 Three.js）
  ============================================================
-->

<style>
  :root{
    --bg-deep:#1c130b;
    --bg-mid:#2e1f12;
    --accent-gold:#e0a15c;
    --accent-cream:#f5e6c8;
    --text-cream:#f5ecdd;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--text-cream);
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; overflow:hidden; }

  /* ---------- 開始畫面 ---------- */
  #start-screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    background:
      radial-gradient(circle at 50% 15%, rgba(224,161,92,0.25), transparent 60%),
      linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
    overflow-y:auto;
  }
  #start-screen h1{
    font-size:24px; margin:4px 0 6px; letter-spacing:1px;
    color:var(--accent-gold);
    text-shadow:0 0 18px rgba(224,161,92,0.4);
  }
  #start-screen p.sub{ margin:0 0 18px; font-size:13px; opacity:0.75; }
  #trigger-preview-wrap{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(224,161,92,0.35);
    border-radius:14px;
    padding:10px;
    margin-bottom:14px;
  }
  #trigger-preview{
    width:160px; height:auto; display:block; border-radius:8px;
    box-shadow:0 0 24px rgba(224,161,92,0.4);
  }
  #trigger-preview-wrap .hint{ font-size:11px; opacity:0.7; margin-top:8px; line-height:1.6; }
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:inherit; font-size:16px; font-weight:700;
    padding:14px 32px; border-radius:999px;
    background:linear-gradient(135deg,var(--accent-gold),#b97a3a);
    color:#241608;
    box-shadow:0 6px 20px rgba(224,161,92,0.3);
    margin-top:6px;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-secondary{
    background:transparent; color:var(--text-cream);
    border:1px solid rgba(245,230,200,0.35);
    box-shadow:none; font-weight:500; font-size:14px; padding:10px 22px;
  }
  #download-link{
    display:inline-block; margin-top:10px; font-size:12px;
    color:var(--accent-gold); text-decoration:underline;
  }
  .steps{
    text-align:left; font-size:12px; line-height:1.9; opacity:0.85;
    max-width:320px; margin:16px 0 6px; padding:12px 16px;
    background:rgba(255,255,255,0.03); border-radius:12px;
  }

  /* ---------- Loading ---------- */
  #loading-screen{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg-deep); z-index:20; padding:24px; text-align:center;
  }
  .spinner{
    width:46px; height:46px; border-radius:50%;
    border:3px solid rgba(224,161,92,0.2);
    border-top-color:var(--accent-gold);
    animation:spin 0.9s linear infinite; margin-bottom:18px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading-text{ font-size:14px; opacity:0.85; }
  #loading-progress{ font-size:12px; opacity:0.6; margin-top:6px; }

  /* ---------- AR 畫面 ---------- */
  #ar-container{ position:absolute; inset:0; display:none; background:#000; }
  #ar-container video, #ar-container canvas{
    position:absolute; inset:0; width:100%!important; height:100%!important; object-fit:cover;
  }

  #ar-hud{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    z-index:15;
  }
  #scan-hint{
    align-self:center; text-align:center;
    background:rgba(28,19,11,0.75);
    border:1px solid rgba(224,161,92,0.4);
    padding:12px 18px; border-radius:14px; font-size:13px;
    max-width:80%; line-height:1.6;
    transition:opacity .25s ease;
  }
  #scan-hint .frame-icon{
    display:block; width:44px; height:44px; margin:0 auto 8px;
    border:2px solid var(--accent-gold); border-radius:8px; opacity:0.8;
  }
  #found-badge{
    align-self:center; text-align:center;
    background:rgba(224,161,92,0.3);
    border:1px solid var(--accent-gold);
    padding:8px 16px; border-radius:999px; font-size:12px;
    opacity:0; transition:opacity .25s ease;
  }
  #top-bar{ display:flex; justify-content:flex-end; pointer-events:auto; }
  #back-btn{
    background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.3);
    color:#fff; font-size:12px; padding:8px 14px; border-radius:999px;
  }

  /* ---------- 錯誤畫面 ---------- */
  #error-screen{
    position:absolute; inset:0; display:none; z-index:30;
    align-items:center; justify-content:center; flex-direction:column;
    background:rgba(28,19,11,0.97); padding:28px; text-align:center;
  }
  #error-screen h2{ color:#f87171; margin:0 0 10px; font-size:18px; }
  #error-screen p{ font-size:13px; line-height:1.7; opacity:0.85; max-width:320px; white-space:pre-line; }

  /* ---------- 除錯用：狀態列 + 記錄面板 ---------- */
  #status-bar{
    position:fixed; top:0; left:0; right:0; z-index:9999;
    font-size:11px; line-height:1.4; color:#c9ffb0;
    background:rgba(0,0,0,0.55);
    padding-top:calc(5px + env(safe-area-inset-top));
    padding:5px 10px calc(5px + env(safe-area-inset-top)) 10px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:monospace;
  }
  #status-bar span#status-text{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #debug-toggle{
    background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3);
    color:#fff; font-size:10px; padding:3px 8px; border-radius:6px; margin-left:8px; flex-shrink:0;
  }
  #debug-panel{
    position:fixed; top:26px; left:0; right:0; bottom:0; z-index:9998;
    background:rgba(0,0,0,0.92); color:#9effa0; font-family:monospace;
    font-size:11px; line-height:1.6; padding:10px; overflow-y:auto;
    display:none; white-space:pre-wrap; word-break:break-all;
  }
  #debug-panel.open{ display:block; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 除錯用狀態列 ============ -->
  <div id="status-bar">
    <span id="status-text">狀態：頁面載入中...</span>
    <button id="debug-toggle">🐞 詳細記錄</button>
  </div>
  <div id="debug-panel"></div>

  <!-- ============ 開始畫面 ============ -->
  <div id="start-screen">
    <h1>☕ 書香・茶香・咖啡香</h1>
    <p class="sub">書展 AR 導覽 Demo（掃描書封）</p>

    <div id="trigger-preview-wrap">
      <img id="trigger-preview" alt="辨識用書封">
      <div class="hint">這是要辨識的書封：《異鄉人》<br>現場請直接掃描實體書本封面</div>
      <a id="download-link" href="#" download="book-cover-trigger.png">下載這張書封圖片</a>
    </div>

    <div class="steps">
      1. 點擊「開始 AR」，允許相機權限<br>
      2. 將《異鄉人》書封完整放入畫面中央<br>
      3. 靜止約 1 秒，咖啡香氣就會從書封中飄出 ☕✨
    </div>

    <button class="btn" id="start-btn">開始 AR</button>
  </div>

  <!-- ============ Loading ============ -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">正在準備辨識資料...</div>
    <div id="loading-progress"></div>
  </div>

  <!-- ============ AR 畫面 ============ -->
  <div id="ar-container"></div>
  <div id="ar-hud">
    <div id="top-bar"><button id="back-btn">✕ 結束</button></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div id="found-badge">✨ 已辨識到書封</div>
      <div id="scan-hint">
        <span class="frame-icon"></span>
        請將《異鄉人》書封<br>完整放入畫面中央
      </div>
    </div>
  </div>

  <!-- ============ 錯誤畫面 ============ -->
  <div id="error-screen">
    <h2>⚠️ 無法啟動 AR</h2>
    <p id="error-message"></p>
    <button class="btn btn-secondary" id="error-retry-btn" style="margin-top:18px;">重新整理</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   ⚙️ 可調參數集中區
   ============================================================ */
const CONFIG = {
  AR_DELAY: 1000,             // 辨識到書封後，延遲多久才開始出現動畫（毫秒）
  ITEM_COUNT: 3,               // 飄浮的咖啡豆/茶葉數量
  ANIMATION_DURATION: 2500,    // 咖啡杯出現到定位的動畫時間（毫秒）
  CUP_SCALE: 1.0,               // 咖啡杯整體大小倍率
  PARTICLE_COUNT: 40,          // 熱氣粒子數量
};

/* ============================================================
   0. 除錯記錄工具
   ============================================================ */
const debugLines = [];
function log(msg){
  const time = new Date().toLocaleTimeString("zh-TW", {hour12:false});
  const line = "[" + time + "] " + msg;
  console.log(line);
  debugLines.push(line);
  if (debugLines.length > 200) debugLines.shift();
  const statusEl = document.getElementById("status-text");
  const panelEl = document.getElementById("debug-panel");
  if (statusEl) statusEl.textContent = "狀態：" + msg;
  if (panelEl){ panelEl.textContent = debugLines.join("\n"); panelEl.scrollTop = panelEl.scrollHeight; }
}
window.addEventListener("error", (e) => {
  log("❌ JS 錯誤：" + (e.message || e.error) + (e.filename ? (" @" + e.filename + ":" + e.lineno) : ""));
});
window.addEventListener("unhandledrejection", (e) => {
  log("❌ Promise 錯誤：" + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
log("script 開始執行");

function loadCoverImage(){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = BOOK_COVER_DATA_URL;
  });
}

/* ============================================================
   2. UI 狀態切換
   ============================================================ */
const el = (id) => document.getElementById(id);
const screens = {
  start: el("start-screen"),
  loading: el("loading-screen"),
  ar: el("ar-container"),
  error: el("error-screen"),
};
function showOnly(name){
  screens.start.style.display = name === "start" ? "flex" : "none";
  screens.loading.style.display = name === "loading" ? "flex" : "none";
  screens.ar.style.display = name === "ar" ? "block" : "none";
  screens.error.style.display = name === "error" ? "flex" : "none";
  el("ar-hud").style.display = name === "ar" ? "flex" : "none";
}
function showError(msg){
  el("error-message").textContent = msg;
  showOnly("error");
}

/* ============================================================
   3. 環境相容性檢查
   ============================================================ */
function checkEnvironmentSupport(){
  const problems = [];
  if (!window.isSecureContext){
    problems.push("此頁面必須透過 HTTPS（或 localhost）開啟才能使用相機。\n請將此檔案部署到 HTTPS 環境（例如 GitHub Pages）後再測試。");
  }
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    problems.push("此瀏覽器不支援相機存取（getUserMedia）。\n請使用最新版 iPhone Safari 或 Android Chrome。");
  }
  try{
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if (!gl) problems.push("此瀏覽器不支援 WebGL，無法顯示 AR 內容。");
  }catch(e){
    problems.push("此瀏覽器不支援 WebGL，無法顯示 AR 內容。");
  }
  if (!(window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler && window.MINDAR.IMAGE.MindARThree)){
    problems.push("AR 函式庫載入失敗，請確認網路連線後重新整理頁面。");
  }
  log("環境檢查完成，發現 " + problems.length + " 個問題" + (problems.length ? "：" + problems.join(" / ") : ""));
  return problems;
}

/* ============================================================
   4. 編譯書封成 .mind 目標資料
   ============================================================ */
async function buildMindTargetURL(coverImg){
  log("建立 Compiler 實例");
  const Compiler = window.MINDAR.IMAGE.Compiler;
  const compiler = new Compiler();
  log("Compiler 實例建立完成，開始編譯書封特徵點 (" + coverImg.width + "x" + coverImg.height + ")");

  await compiler.compileImageTargets([coverImg], (progress) => {
    el("loading-text").textContent = "正在分析書封特徵點...";
    el("loading-progress").textContent = "進度：" + progress.toFixed(0) + "%";
    if (Math.round(progress) % 20 === 0) log("編譯進度 " + progress.toFixed(0) + "%");
  });
  log("compileImageTargets 完成，開始匯出資料");

  const buffer = await compiler.exportData();
  log("exportData 完成，buffer 大小 " + buffer.byteLength + " bytes");
  const blob = new Blob([buffer]);
  const url = URL.createObjectURL(blob);
  log("已建立 .mind Blob URL");
  return url;
}

/* ============================================================
   5. Three.js AR 內容：咖啡杯、熱氣、咖啡豆/茶葉
   ============================================================ */
function easeOutBack(x){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function lerp(a,b,t){ return a + (b-a)*t; }
function clamp01(x){ return Math.max(0, Math.min(1, x)); }

function createCoffeeCupMesh(THREE, scale){
  const group = new THREE.Group();

  const ceramicMat = new THREE.MeshStandardMaterial({ color:0xfffaf0, roughness:0.4, metalness:0.05 });

  const saucer = new THREE.Mesh(new THREE.CylinderGeometry(0.17*scale, 0.17*scale, 0.012*scale, 32), ceramicMat);
  saucer.position.y = -0.09*scale;
  group.add(saucer);

  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.095*scale, 0.075*scale, 0.16*scale, 28, 1, true), ceramicMat);
  group.add(cup);

  const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.075*scale, 28), ceramicMat);
  bottom.rotation.x = -Math.PI/2;
  bottom.position.y = -0.08*scale;
  group.add(bottom);

  const coffeeMat = new THREE.MeshStandardMaterial({ color:0x3b2415, roughness:0.25 });
  const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.088*scale, 28), coffeeMat);
  coffee.rotation.x = -Math.PI/2;
  coffee.position.y = 0.076*scale;
  group.add(coffee);

  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.05*scale, 0.014*scale, 10, 20, Math.PI*1.3), ceramicMat);
  handle.rotation.z = Math.PI/2;
  handle.position.set(0.105*scale, 0, 0);
  group.add(handle);

  return group;
}

function createCoffeeBean(THREE, size){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x3b2415, roughness:0.45 });
  const bean = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 10), mat);
  bean.scale.set(0.75, 1, 0.55);
  group.add(bean);
  const creaseMat = new THREE.MeshStandardMaterial({ color:0x1f1209 });
  const crease = new THREE.Mesh(new THREE.BoxGeometry(size*0.1, size*1.7, size*0.62), creaseMat);
  group.add(crease);
  return group;
}

function createTeaLeaf(THREE, size){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x3f7d3a, roughness:0.6, side:THREE.DoubleSide });
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 10), mat);
  leaf.scale.set(1, 0.25, 1.7);
  group.add(leaf);
  const veinMat = new THREE.MeshStandardMaterial({ color:0x2c5a29 });
  const vein = new THREE.Mesh(new THREE.BoxGeometry(size*0.08, size*0.08, size*1.6), veinMat);
  vein.position.y = size*0.15;
  group.add(vein);
  return group;
}

function makeSteamTexture(THREE){
  const size = 64;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  const grad = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  grad.addColorStop(0, "rgba(255,255,255,0.9)");
  grad.addColorStop(0.5, "rgba(255,255,255,0.35)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}

function createSteamParticles(THREE, count){
  const positions = new Float32Array(count*3);
  const speeds = new Float32Array(count);
  const phases = new Float32Array(count);
  const amps = new Float32Array(count);
  const baseX = new Float32Array(count);
  const baseZ = new Float32Array(count);
  const startY = new Float32Array(count);
  const riseRange = 0.55;

  for (let i=0;i<count;i++){
    baseX[i] = (Math.random()-0.5) * 0.035;
    baseZ[i] = (Math.random()-0.5) * 0.035;
    startY[i] = 0.08 + Math.random()*0.05;
    positions[i*3+0] = baseX[i];
    positions[i*3+1] = startY[i] + Math.random()*riseRange;
    positions[i*3+2] = baseZ[i] + 0.02;
    speeds[i] = 0.06 + Math.random()*0.05;
    phases[i] = Math.random()*Math.PI*2;
    amps[i] = 0.03 + Math.random()*0.05;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.07,
    map: makeSteamTexture(THREE),
    transparent: true,
    depthWrite: false,
    color: 0xffffff,
    opacity: 0.55,
    blending: THREE.NormalBlending,
  });

  const points = new THREE.Points(geo, mat);
  points.visible = false;
  points.userData = { positions, speeds, phases, amps, baseX, baseZ, startY, count, riseRange };
  return points;
}

function updateSteam(points, elapsed, delta){
  if (!points.visible) return;
  const { positions, speeds, phases, amps, baseX, baseZ, startY, count, riseRange } = points.userData;
  for (let i=0;i<count;i++){
    let y = positions[i*3+1] + speeds[i]*delta;
    if (y > startY[i] + riseRange){ y = startY[i]; }
    const riseT = (y - startY[i]) / riseRange;
    positions[i*3+1] = y;
    positions[i*3+0] = baseX[i] + Math.sin(elapsed*1.2 + phases[i]) * amps[i] * (0.3 + riseT);
    positions[i*3+2] = baseZ[i] + Math.cos(elapsed*0.9 + phases[i]) * amps[i] * 0.5 * (0.3 + riseT);
  }
  points.geometry.attributes.position.needsUpdate = true;
}

/* 通用出場動畫（縮放 0→1 + 位移，之後持續漂浮） */
function makeAnimatedItem(mesh, opts){
  mesh.userData.anim = Object.assign({
    appearStart: 0,
    appearDuration: 1,
    startPos: {x:0,y:0,z:0.02},
    endPos: {x:0,y:0.2,z:0.05},
    endScale: 1,
    bobSpeed: 1,
    bobAmp: 0.03,
    bobPhase: Math.random()*Math.PI*2,
    rotSpeed: 0.4,
  }, opts);
  mesh.scale.setScalar(0.0001);
  mesh.position.set(opts.startPos.x, opts.startPos.y, opts.startPos.z);
  return mesh;
}

function updateAnimatedItem(mesh, elapsed){
  const a = mesh.userData.anim;
  const t = clamp01((elapsed - a.appearStart) / a.appearDuration);
  if (t <= 0){ mesh.visible = false; return; }
  mesh.visible = true;
  const eased = easeOutBack(t);

  const bx = lerp(a.startPos.x, a.endPos.x, Math.min(t*1.15,1));
  const by = lerp(a.startPos.y, a.endPos.y, Math.min(t*1.15,1));
  const bz = lerp(a.startPos.z, a.endPos.z, Math.min(t*1.15,1));

  const bob = t >= 1 ? Math.sin(elapsed*a.bobSpeed + a.bobPhase) * a.bobAmp : 0;

  mesh.position.set(bx, by + bob, bz);
  mesh.scale.setScalar(Math.max(0.0001, eased) * a.endScale);
  mesh.rotation.y = elapsed * a.rotSpeed * (t>=1 ? 1 : t);
  mesh.rotation.z = t>=1 ? Math.sin(elapsed*0.6 + a.bobPhase)*0.06 : 0;
}

/* ============================================================
   6. 主流程
   ============================================================ */
let mindarThree = null;
let renderStarted = false;

async function startAR(coverImg){
  log("startAR() 開始");
  showOnly("loading");
  el("loading-text").textContent = "正在準備辨識資料...";
  el("loading-progress").textContent = "";

  let mindURL;
  try{
    mindURL = await buildMindTargetURL(coverImg);
  }catch(e){
    console.error(e);
    log("❌ 編譯失敗：" + (e && e.message ? e.message : e));
    showError("辨識目標編譯失敗：\n" + (e && e.message ? e.message : e));
    return;
  }

  el("loading-text").textContent = "正在啟動相機...";
  el("loading-progress").textContent = "";

  // 重要修正：必須先讓 #ar-container 變成可見（display:block）取得正確尺寸，
  // 再「建立」MindARThree 實例，否則它初始化時算到的容器寬高會是 0，
  // 之後即使畫面切換過來，渲染/追蹤用的畫布尺寸也不會自動修正，
  // 結果就是「看得到相機影像（純 CSS 撐出來的），但永遠比對不到任何東西」。
  showOnly("ar");
  log("已切換到 AR 容器（使其取得正確尺寸），準備建立 MindARThree");

  const THREE = window.MINDAR.IMAGE.THREE;
  const MindARThree = window.MINDAR.IMAGE.MindARThree;

  try{
    mindarThree = new MindARThree({
      container: el("ar-container"),
      imageTargetSrc: mindURL,
      uiScanning: "no",
      uiLoading: "no",
      uiError: "no",
    });
    log("MindARThree 實例建立成功");
  }catch(e){
    console.error(e);
    log("❌ MindARThree 建立失敗：" + (e && e.message ? e.message : e));
    showError("AR 引擎初始化失敗：\n" + (e && e.message ? e.message : e));
    return;
  }

  const { renderer, scene, camera } = mindarThree;
  const anchor = mindarThree.addAnchor(0);

  // 燈光
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 0.5);
  dir.position.set(0.5, 1, 1);
  scene.add(dir);
  const warmLight = new THREE.PointLight(0xffce9a, 1.0, 2.2);
  warmLight.position.set(0, 0.2, 0.2);
  anchor.group.add(warmLight);

  // 咖啡杯
  const cup = createCoffeeCupMesh(THREE, CONFIG.CUP_SCALE);
  makeAnimatedItem(cup, {
    appearStart: 999999,
    appearDuration: (CONFIG.ANIMATION_DURATION/1000) * 0.5,
    startPos: {x:0, y:-0.05, z:0.02},
    endPos: {x:0, y:0.05, z:0.1},
    endScale: 1,
    bobSpeed: 0.8,
    bobAmp: 0.018,
    rotSpeed: 0.12,
  });
  anchor.group.add(cup);

  // 飄浮咖啡豆 / 茶葉
  const itemTypes = ["bean", "leaf"];
  const items = [];
  for (let i=0; i<CONFIG.ITEM_COUNT; i++){
    const angle = (Math.PI*2 / CONFIG.ITEM_COUNT) * i + Math.PI/5;
    const dist = 0.22 + Math.random()*0.1;
    const type = itemTypes[i % itemTypes.length];
    const mesh = type === "bean"
      ? createCoffeeBean(THREE, 0.035 * CONFIG.CUP_SCALE)
      : createTeaLeaf(THREE, 0.05 * CONFIG.CUP_SCALE);
    makeAnimatedItem(mesh, {
      appearStart: 999999,
      appearDuration: (CONFIG.ANIMATION_DURATION/1000) * 0.6,
      startPos: {x:0, y:0.05, z:0.08},
      endPos: {
        x: Math.cos(angle) * dist,
        y: 0.12 + Math.sin(angle) * dist * 0.4,
        z: 0.1 + Math.random()*0.08,
      },
      endScale: 1,
      bobSpeed: 0.6 + Math.random()*0.6,
      bobAmp: 0.02 + Math.random()*0.02,
      rotSpeed: 0.3 + Math.random()*0.5,
    });
    anchor.group.add(mesh);
    items.push(mesh);
  }

  // 熱氣粒子
  const steam = createSteamParticles(THREE, CONFIG.PARTICLE_COUNT);
  anchor.group.add(steam);

  // ---- 狀態控制：等待辨識 → 延遲 → 出現動畫 ----
  let revealTimer = null;
  let hasScheduled = false;

  function resetSceneHidden(){
    [cup, ...items].forEach(m => { m.visible = false; m.scale.setScalar(0.0001); });
    steam.visible = false;
  }
  resetSceneHidden();

  anchor.onTargetFound = () => {
    log("✅ onTargetFound 觸發（辨識到書封）");
    el("scan-hint").style.opacity = "0";
    el("found-badge").style.opacity = "1";
    if (hasScheduled) return;
    hasScheduled = true;
    revealTimer = setTimeout(() => {
      log("⏱ AR_DELAY 結束，開始播放咖啡杯動畫");
      const now = clock.getElapsedTime();
      cup.userData.anim.appearStart = now;
      items.forEach((item, i) => {
        item.userData.anim.appearStart = now + (CONFIG.ANIMATION_DURATION/1000)*0.35 + i * (CONFIG.ANIMATION_DURATION/1000)*0.18;
      });
      steam.visible = true;
    }, CONFIG.AR_DELAY);
  };

  anchor.onTargetLost = () => {
    log("target lost（暫時追蹤不到）");
    el("scan-hint").style.opacity = "1";
    el("found-badge").style.opacity = "0";
    if (revealTimer){ clearTimeout(revealTimer); revealTimer = null; }
    hasScheduled = false;
    resetSceneHidden();
  };

  // ---- 啟動相機與渲染迴圈 ----
  log("呼叫 mindarThree.start()（會跳出相機權限請求）");
  try{
    await mindarThree.start();
    log("✅ mindarThree.start() 成功，相機已啟動");
  }catch(e){
    console.error(e);
    let msg = "無法啟動相機。";
    if (e && e.name === "NotAllowedError") msg = "您拒絕了相機權限，請重新整理頁面並允許存取相機。";
    else if (e && e.name === "NotFoundError") msg = "找不到可用的相機裝置。";
    else if (e && e.message) msg += "\n" + e.message;
    log("❌ mindarThree.start() 失敗：" + (e && (e.name || e.message)));
    showError(msg);
    return;
  }

  // 保險：相機啟動後，容器尺寸一定是正確的了，強制重新計算一次渲染器尺寸
  // 與相機投影矩陣，並補發一個 resize 事件，避免任何殘留的 0 尺寸狀態。
  const containerEl = el("ar-container");
  renderer.setSize(containerEl.clientWidth, containerEl.clientHeight);
  camera.aspect = containerEl.clientWidth / containerEl.clientHeight;
  camera.updateProjectionMatrix();
  window.dispatchEvent(new Event("resize"));
  log("已強制校正渲染尺寸：" + containerEl.clientWidth + "x" + containerEl.clientHeight);

  const clock = new THREE.Clock();
  renderStarted = true;
  let firstFrame = true;
  renderer.setAnimationLoop(() => {
    if (firstFrame){ log("🎬 render loop 已開始運作，等待辨識目標..."); firstFrame = false; }
    const delta = clock.getDelta();
    const elapsed = clock.getElapsedTime();
    updateAnimatedItem(cup, elapsed);
    items.forEach(m => updateAnimatedItem(m, elapsed));
    updateSteam(steam, elapsed, delta);
    renderer.render(scene, camera);
  });

  log("render loop 設定完成");
}

function stopAR(){
  try{
    if (mindarThree){
      if (renderStarted) mindarThree.renderer.setAnimationLoop(null);
      mindarThree.stop();
    }
  }catch(e){ console.warn(e); }
  location.reload();
}

   7. 綁定事件、初始化
   ============================================================ */
window.addEventListener("DOMContentLoaded", async () => {
  log("DOMContentLoaded，MINDAR 全域物件是否存在：" + !!(window.MINDAR && window.MINDAR.IMAGE));

  el("trigger-preview").src = BOOK_COVER_DATA_URL;
  el("download-link").href = BOOK_COVER_DATA_URL;

  let coverImg = null;
  try{
    coverImg = await loadCoverImage();
    log("書封圖片載入完成 (" + coverImg.width + "x" + coverImg.height + ")");
  }catch(e){
    log("❌ 書封圖片載入失敗：" + e);
  }

  el("start-btn").addEventListener("click", async () => {
    log("使用者點擊「開始 AR」");
    const problems = checkEnvironmentSupport();
    if (problems.length){
      showError(problems.join("\n\n"));
      return;
    }
    if (!coverImg){
      showError("書封圖片尚未載入完成，請重新整理頁面再試一次。");
      return;
    }
    await startAR(coverImg);
  });

  el("back-btn").addEventListener("click", stopAR);
  el("error-retry-btn").addEventListener("click", () => location.reload());
  el("debug-toggle").addEventListener("click", () => {
    el("debug-panel").classList.toggle("open");
  });
});

})();
