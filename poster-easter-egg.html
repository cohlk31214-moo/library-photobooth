<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>書展藏了東西 AR 彩蛋</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
  #container { position: fixed; top:0; left:0; width:100%; height:100%; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 14px 16px; box-sizing: border-box;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
    color: #fff; z-index: 10; pointer-events: none;
  }
  #ui h1 { margin: 0; font-size: 17px; letter-spacing: 1px; }
  #ui p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  #status {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #fff; padding: 8px 18px;
    border-radius: 20px; font-size: 14px; z-index: 10; transition: opacity 0.3s;
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  #status.show { opacity: 1; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 20;
    background: #000; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  #startOverlay h1 { font-size: 20px; margin: 0 0 10px; }
  #startOverlay p { font-size: 18px; line-height: 1.6; opacity: 0.85; margin: 0 0 28px; }
  #startBtn {
    padding: 14px 36px; font-size: 16px; border-radius: 28px; border: none;
    background: #fff; color: #000; font-weight: bold;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>🤫 書展裡藏了東西</h1>
  <p>請點擊下方按鈕啟動相機，<br>接著將鏡頭對準海報</p>
  <button id="startBtn">▶ 點擊開始 AR</button>
</div>

<div id="ui">
  <h1>🤫 書展裡藏了東西</h1>
  <p>請將鏡頭對準海報</p>
</div>
<div id="container"></div>
<div id="status"></div>
<script>
  window.addEventListener("error", (e) => {
    const overlay = document.getElementById("startOverlay");
    overlay.style.display = "flex";
    overlay.innerHTML =
      '<h1>⚠️ 程式錯誤</h1><p style="color:#ff8080; max-width: 320px; word-break: break-word;">' +
      (e.message || "未知錯誤") +
      "</p>";
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

const statusEl = document.getElementById("status");
function showStatus(text) {
  statusEl.textContent = text;
  statusEl.classList.add("show");
}
function hideStatus() {
  statusEl.classList.remove("show");
}

const mindarThree = new MindARThree({
  container: document.querySelector("#container"),
  imageTargetSrc: "./targets-poster.mind",
  maxTrack: 1,
  filterMinCF: 0.0001,
  filterBeta: 0.001,
});
const { renderer, scene, camera } = mindarThree;

const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(light);

/* ============================================================
   彩蛋內容：5段依序淡入，「上一段出現完，下一段才開始出現」
   delay：從掃到海報那一刻開始算，第幾秒該段開始淡入（單位：秒）
   pxHeight：原始裁切圖檔的像素高度，用來自動算版面比例，不用手動對位
   之後如果要調整「等待時間」，只要改 delay 的數字就好
   ============================================================ */
const SEGMENTS = [
  { src: "./poster-seg1-icons.png",    pxHeight: 110, delay: 0.0 },
  { src: "./poster-seg2-date.png",     pxHeight: 110, delay: 1.0 },
  { src: "./poster-seg3-qr.png",       pxHeight: 65,  delay: 2.0 },
  { src: "./poster-seg4-surprise.png", pxHeight: 350, delay: 3.0 },
  { src: "./poster-seg5-character.png",pxHeight: 538, delay: 4.3 },
];
const PX_WIDTH = 1190;      // 原始裁切圖檔的寬度（5張都是同寬，才能對齊）
const PLANE_WIDTH = 1.0;    // 顯示在AR裡的寬度（世界座標單位）
const FADE_DURATION = 0.45; // 每段淡入所需時間（秒）
const TOP_Y = 0.55;         // 第一段（最上面）距離海報中心的高度

function createPosterRevealGroup() {
  const group = new THREE.Group();
  const loader = new THREE.TextureLoader();
  const scale = PLANE_WIDTH / PX_WIDTH;

  let cumulative = 0;
  const meshes = SEGMENTS.map((seg) => {
    const height = seg.pxHeight * scale;
    const centerY = TOP_Y - cumulative - height / 2;
    cumulative += height;

    const texture = loader.load(seg.src);
    texture.colorSpace = THREE.SRGBColorSpace;
    const material = new THREE.MeshBasicMaterial({
      map: texture, transparent: true, opacity: 0, depthWrite: false,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(PLANE_WIDTH, height), material);
    mesh.position.set(0, centerY, 0);
    group.add(mesh);
    return { mesh, delay: seg.delay };
  });

  let triggerT = null;

  group.userData.trigger = (t) => {
    triggerT = t;
  };
  group.userData.reset = () => {
    triggerT = null;
    meshes.forEach(({ mesh }) => (mesh.material.opacity = 0));
  };
  group.userData.update = (t) => {
    if (triggerT === null) return;
    const elapsed = t - triggerT;
    meshes.forEach(({ mesh, delay }) => {
      const local = elapsed - delay;
      const opacity = THREE.MathUtils.clamp(local / FADE_DURATION, 0, 1);
      mesh.material.opacity = opacity;
    });
  };

  return group;
}

const anchor = mindarThree.addAnchor(0);
const revealGroup = createPosterRevealGroup();
anchor.group.add(revealGroup);

anchor.onTargetFound = () => {
  showStatus("🤫 書展裡藏了東西...");
  revealGroup.userData.trigger(clock.getElapsedTime());
};
anchor.onTargetLost = () => {
  hideStatus();
  revealGroup.userData.reset();
};

const clock = new THREE.Clock();
const start = async () => {
  try {
    await mindarThree.start();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      revealGroup.userData.update(t);
      renderer.render(scene, camera);
    });
  } catch (err) {
    document.getElementById("startOverlay").style.display = "flex";
    document.getElementById("startOverlay").innerHTML =
      '<h1>⚠️ 啟動失敗</h1><p style="color:#ff8080; max-width: 320px; word-break: break-word;">' +
      (err && err.message ? err.message : String(err)) +
      "</p>";
  }
};

document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("startOverlay").style.display = "none";
  start();
});
</script>
</body>
</html>
