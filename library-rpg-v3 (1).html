<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>看不見的圖書館 — 電子書偵探社</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,html{height:100%;width:100%;}
body{height:100%;width:100%;background:#0a0a1a;font-family:'Noto Sans TC',sans-serif;overflow:hidden;touch-action:none;}

/* ══ GAME WRAPPER ══ */
#game-wrap{position:fixed;inset:0;display:flex;flex-direction:column;}

/* ══ HUD ══ */
#hud{
  background:rgba(10,10,30,0.85);
  border-bottom:1.5px solid rgba(100,180,255,0.3);
  padding:6px 14px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;z-index:50;
  backdrop-filter:blur(8px);
}
.hud-title{font-size:12px;font-weight:900;color:#7fffd4;letter-spacing:1px;flex:1;}
.hud-bag{display:flex;gap:6px;}
.hud-item{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(100,180,255,0.3);
  border-radius:6px;padding:3px 10px;
  font-size:11px;color:#e8e8ff;
  display:flex;align-items:center;gap:4px;
}
.hud-item .cnt{
  background:#f4c430;color:#000;
  border-radius:99px;min-width:16px;height:16px;
  font-size:10px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ══ MAP AREA ══ */
#map-wrap{flex:1;position:relative;overflow:hidden;}
#game-canvas{position:absolute;top:0;left:0;image-rendering:pixelated;}

/* ══ STATUS ══ */
#status{
  position:absolute;top:6px;right:10px;
  font-size:11px;color:#7fffd4;z-index:20;
  background:rgba(0,0,0,0.6);padding:3px 10px;border-radius:6px;
}

/* ══ DIALOG ══ */
#dialog{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(8,15,30,0.95);
  border-top:2px solid rgba(100,180,255,0.5);
  padding:14px 16px 12px;
  z-index:60;display:none;
  backdrop-filter:blur(10px);
  animation:slideUp 0.25s ease;
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.dlg-speaker{font-size:11px;font-weight:900;color:#7fffd4;letter-spacing:1px;margin-bottom:7px;}
.dlg-text{font-size:14px;color:rgba(255,255,255,0.92);line-height:1.85;min-height:46px;}
.dlg-tap{text-align:right;font-size:11px;color:rgba(255,255,255,0.28);margin-top:7px;animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:0}}

/* ══ OPAC POV ══ */
#opac-screen{
  position:absolute;inset:0;
  background:#f0f0f0;
  z-index:80;display:none;
  flex-direction:column;
  animation:fadeIn 0.4s ease;
}
#opac-screen.show{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.browser-bar{background:#3c3c3c;padding:7px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.b-dots{display:flex;gap:5px;}
.b-dot{width:10px;height:10px;border-radius:50%;}
.b-url{flex:1;background:#555;border-radius:4px;padding:4px 10px;font-size:11px;color:#ddd;font-family:monospace;}

.opac-header{background:#1a1a2e;padding:10px 14px 14px;flex-shrink:0;}
.opac-logo{font-size:13px;font-weight:900;color:#fff;}
.opac-logo span{display:block;font-size:10px;font-weight:400;color:#aaa;}
.opac-tabs{display:flex;gap:2px;margin:10px 0;}
.opac-tab{font-size:12px;padding:5px 10px;border-radius:4px 4px 0 0;color:#aaa;background:rgba(255,255,255,.05);}
.opac-tab.active{background:#fff;color:#1a1a1a;font-weight:700;}
.opac-row{display:flex;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.opac-input{flex:1;border:none;padding:10px 14px;font-size:14px;font-family:'Noto Sans TC',sans-serif;outline:none;color:#1a1a1a;}
.opac-search-btn{background:#e07b00;color:#fff;border:none;padding:10px 18px;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}
.type-wrap{display:flex;align-items:center;gap:8px;margin-top:8px;}
.type-lbl{font-size:11px;color:rgba(255,255,255,.6);}
.type-sel{position:relative;}
.type-btn{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:4px;padding:5px 10px;font-size:12px;color:#fff;cursor:pointer;font-family:'Noto Sans TC',sans-serif;display:flex;align-items:center;gap:4px;transition:all .15s;}
.type-btn.pulse{border-color:#e07b00;animation:tpulse 1.5s infinite;}
@keyframes tpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,123,0,.4)}50%{box-shadow:0 0 0 6px rgba(224,123,0,0)}}
.type-dd{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:200;min-width:140px;overflow:hidden;}
.type-dd.hidden{display:none;}
.type-opt{padding:10px 14px;font-size:13px;cursor:pointer;color:#1a1a1a;border-bottom:1px solid #f0f0f0;transition:background .1s;}
.type-opt:last-child{border:none;}
.type-opt:hover{background:#e8f5f1;}
.type-opt.good{color:#2d6a4f;font-weight:700;}

.opac-body{background:#fff;flex:1;padding:12px 14px;overflow-y:auto;}
.opac-prompt{text-align:center;padding:36px 20px;color:#666;font-size:14px;line-height:1.8;}
.opac-prompt-icon{font-size:36px;display:block;margin-bottom:10px;}
.res-header{font-size:12px;color:#666;padding:8px 0;border-bottom:1px solid #eee;margin-bottom:10px;}
.res-count{color:#2d6a4f;font-weight:700;}
.res-item{border:1px solid #eee;border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;background:#fafafa;}
.res-item:hover{border-color:#00785a;background:#e8f5f1;}
.res-item.target{border-left:3px solid #00785a;}
.ri-title{font-size:14px;font-weight:700;color:#1a5fa8;}
.ri-author{font-size:12px;color:#666;margin-top:3px;}
.ri-tags{margin-top:5px;display:flex;gap:4px;}
.ri-tag{font-size:10px;padding:2px 8px;border-radius:99px;background:#eee;color:#555;}
.ri-tag.ebook{background:#e8f5f1;color:#2d6a4f;font-weight:700;}
.alert-box{background:#fdecea;border:1px solid #f5c6c6;border-radius:8px;padding:11px 14px;font-size:13px;color:#7a1a1a;margin-bottom:10px;line-height:1.6;}
.alert-box.warn{background:#fff8ee;border-color:#f0d070;color:#7a5a00;}
.alert-box.ok{background:#e8f5e9;border-color:#a5d6a7;color:#1a4a2a;}
.btn-back-opac{background:#1a1a2e;color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-top:12px;width:100%;}

/* ══ TREASURE POPUP ══ */
#treasure{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;
}
#treasure.show{display:flex;}
.tr-card{
  background:linear-gradient(135deg,#1a1a2e,#2d1b4e);
  border:2px solid #f4c430;border-radius:16px;
  padding:24px 20px;max-width:320px;width:100%;text-align:center;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{opacity:0;transform:scale(0.7) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.tr-badge{font-size:10px;font-weight:700;letter-spacing:3px;color:#f4c430;margin-bottom:8px;}
.tr-icon{font-size:52px;margin-bottom:10px;animation:float 2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tr-name{font-size:20px;font-weight:900;color:#fff;margin-bottom:8px;}
.tr-desc{font-size:13px;color:#aaa;line-height:1.75;margin-bottom:16px;white-space:pre-line;}
.qr-wrap{background:#fff;border-radius:10px;padding:12px;display:inline-block;margin-bottom:14px;}
.qr-lbl{font-size:11px;color:#555;margin-top:5px;}
.btn-tr{background:#f4c430;color:#1a1a00;border:none;border-radius:8px;padding:12px 36px;font-size:14px;font-weight:900;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}

/* ══ DPAD ══ */
#dpad{position:absolute;bottom:14px;left:14px;z-index:30;}
.dpad-grid{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px;}
.dp-btn{
  background:rgba(255,255,255,0.1);
  border:1.5px solid rgba(255,255,255,0.18);
  border-radius:10px;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .1s;
}
.dp-btn:active,.dp-btn.pr{background:rgba(255,255,255,0.28);}
.dp-empty{background:transparent;border-color:transparent;pointer-events:none;}

/* ══ ACTION BTN ══ */
#act-btn{
  position:absolute;bottom:22px;right:14px;
  width:62px;height:62px;z-index:30;
  background:rgba(127,255,212,0.15);
  border:2px solid #7fffd4;border-radius:50%;
  font-size:11px;font-weight:900;color:#7fffd4;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
#act-btn:active{background:rgba(127,255,212,0.35);}
</style>
</head>
<body>
<div id="game-wrap">

  <!-- HUD -->
  <div id="hud">
    <div class="hud-title">🏛️ 看不見的圖書館</div>
    <div class="hud-bag">
      <div class="hud-item" id="hud-items" style="display:none;">🎒道具 <span class="cnt" id="item-cnt">0</span></div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="status">靠近物件按【互動】</div>

    <!-- DPAD -->
    <div id="dpad">
      <div class="dpad-grid">
        <div class="dp-empty"></div>
        <div class="dp-btn" ontouchstart="mv('up')" ontouchend="sm()" onmousedown="mv('up')" onmouseup="sm()">▲</div>
        <div class="dp-empty"></div>
        <div class="dp-btn" ontouchstart="mv('left')" ontouchend="sm()" onmousedown="mv('left')" onmouseup="sm()">◀</div>
        <div class="dp-empty"></div>
        <div class="dp-btn" ontouchstart="mv('right')" ontouchend="sm()" onmousedown="mv('right')" onmouseup="sm()">▶</div>
        <div class="dp-empty"></div>
        <div class="dp-btn" ontouchstart="mv('down')" ontouchend="sm()" onmousedown="mv('down')" onmouseup="sm()">▼</div>
        <div class="dp-empty"></div>
      </div>
    </div>
    <div id="act-btn" ontouchstart="act()" onmousedown="act()">互動</div>

    <!-- DIALOG -->
    <div id="dialog">
      <div class="dlg-speaker" id="dlg-spk"></div>
      <div class="dlg-text" id="dlg-txt"></div>
      <div class="dlg-tap" id="dlg-tap">▼ 點此繼續</div>
    </div>
  </div>

  <!-- OPAC POV -->
  <div id="opac-screen">
    <div class="browser-bar">
      <div class="b-dots">
        <div class="b-dot" style="background:#ff5f57"></div>
        <div class="b-dot" style="background:#febc2e"></div>
        <div class="b-dot" style="background:#28c840"></div>
      </div>
      <div class="b-url" id="opac-url">book.tpml.edu.tw</div>
    </div>
    <div class="opac-header">
      <div class="opac-logo">臺北市立圖書館<span>館藏查詢系統 / OPAC</span></div>
      <div class="opac-tabs">
        <div class="opac-tab active">簡易查詢</div>
        <div class="opac-tab">進階查詢</div>
        <div class="opac-tab">分館查詢</div>
      </div>
      <div class="opac-row">
        <input type="text" class="opac-input" id="opac-q" placeholder="請輸入關鍵字文字">
        <button class="opac-search-btn" onclick="doSearch()">查詢</button>
      </div>
      <div class="type-wrap">
        <span class="type-lbl">類型：</span>
        <div class="type-sel">
          <button class="type-btn pulse" id="type-btn" onclick="toggleDD()">
            <span id="type-lbl">全部類型</span> ▾
          </button>
          <div class="type-dd hidden" id="type-dd">
            <div class="type-opt" onclick="pickType('圖書')">圖書</div>
            <div class="type-opt" onclick="pickType('期刊')">期刊</div>
            <div class="type-opt" onclick="pickType('視聽資料')">視聽資料</div>
            <div class="type-opt good" onclick="pickType('電子資源')">電子資源 ← 選這個！</div>
          </div>
        </div>
      </div>
    </div>
    <div class="opac-body" id="opac-body">
      <div class="opac-prompt">
        <span class="opac-prompt-icon">💡</span>
        <strong>館員提示：</strong><br>
        先把「全部類型」切換成<br>「<strong>電子資源</strong>」<br>再輸入書名查詢！
      </div>
    </div>
    <div style="padding:0 14px 14px;">
      <button class="btn-back-opac" onclick="closeOpac()">← 返回圖書館</button>
    </div>
  </div>

  <!-- TREASURE -->
  <div id="treasure">
    <div class="tr-card">
      <div class="tr-badge">✦ 獲得道具 ✦</div>
      <div class="tr-icon" id="tr-icon"></div>
      <div class="tr-name" id="tr-name"></div>
      <div class="tr-desc" id="tr-desc"></div>
      <div class="qr-wrap">
        <canvas id="qr-canvas" width="120" height="120"></canvas>
        <div class="qr-lbl" id="qr-lbl"></div>
      </div>
      <button class="btn-tr" onclick="closeTreasure()">收入背包 →</button>
    </div>
  </div>

</div>

// ══ QR CODE ══
function drawQR(canvas, url) {
  const ctx=canvas.getContext('2d'), size=120, cells=21, cs=size/cells;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#000';
  let seed=0;
  for(let i=0;i<url.length;i++) seed=(seed*31+url.charCodeAt(i))&0xffffffff;
  function rand(){ seed=(seed*1664525+1013904223)&0xffffffff; return(seed>>>0)/0xffffffff; }
  function finder(ox,oy){
    ctx.fillRect(ox*cs,oy*cs,7*cs,7*cs);
    ctx.fillStyle='#fff'; ctx.fillRect((ox+1)*cs,(oy+1)*cs,5*cs,5*cs);
    ctx.fillStyle='#000'; ctx.fillRect((ox+2)*cs,(oy+2)*cs,3*cs,3*cs);
  }
  finder(0,0); finder(14,0); finder(0,14);
  for(let r=0;r<cells;r++) for(let c=0;c<cells;c++){
    if((r<8&&c<8)||(r<8&&c>12)||(r>12&&c<8)) continue;
    if(rand()>0.48) ctx.fillRect(c*cs,r*cs,cs,cs);
  }
}

// ══ RENDER ══
function render(){
  if(!ctx) return;
  ctx.clearRect(0,0,viewW,viewH);

  updateCam();

  // 背景圖
  if(bgLoaded){
    const bgW=MW*TW, bgH=MH*TH;
    ctx.drawImage(BG_IMG, -camX, -camY, bgW, bgH);
  } else {
    ctx.fillStyle='#0a1428';
    ctx.fillRect(0,0,viewW,viewH);
  }

  // 半透明碰撞偵錯（開發用，可關閉）
  // drawDebugGrid();

  // 互動物件光暈
  OBJECTS.forEach(obj=>{
    if(obj.done) return;
    const sx=obj.tx*TW-camX, sy=obj.ty*TH-camY;
    const grd=ctx.createRadialGradient(sx+TW/2,sy+TH/2,4,sx+TW/2,sy+TH/2,24);
    grd.addColorStop(0,`rgba(127,255,212,${0.3+0.15*Math.sin(animFrame*0.08)})`);
    grd.addColorStop(1,'rgba(127,255,212,0)');
    ctx.fillStyle=grd;
    ctx.fillRect(sx-10,sy-10,TW+20,TH+20);
  });

  // 玩家
  drawPlayer();

  // 附近提示
  const near=getNear();
  if(near && !dlgActive){
    const sx=near.tx*TW-camX, sy=near.ty*TH-camY;
    ctx.fillStyle='rgba(0,0,0,0.75)';
    ctx.beginPath();
    ctx.roundRect(sx-8,sy-28,TW+16,18,4);
    ctx.fill();
    ctx.fillStyle='#7fffd4';
    ctx.font='bold 10px Noto Sans TC';
    ctx.textAlign='center';
    ctx.fillText('按【互動】',sx+TW/2,sy-14);
    ctx.textAlign='left';
    document.getElementById('status').textContent='靠近：'+near.label+'　按【互動】';
  } else if(!dlgActive){
    document.getElementById('status').textContent='靠近物件按【互動】';
  }

  animFrame++;
  requestAnimationFrame(render);
}

function updateCam(){
  const tx=player.tx*TW-viewW/2+TW/2;
  const ty=player.ty*TH-viewH/2+TH/2;
  const maxX=Math.max(0,MW*TW-viewW);
  const maxY=Math.max(0,MH*TH-viewH);
  camX+=(Math.max(0,Math.min(maxX,tx))-camX)*0.12;
  camY+=(Math.max(0,Math.min(maxY,ty))-camY)*0.12;
}

function drawPlayer(){
  const sx=player.tx*TW-camX;
  const sy=player.ty*TH-camY;
  const bounce=canMove?Math.sin(animFrame*0.1)*2:0;

  // 陰影
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx+TW/2,sy+TH-3,13,5,0,0,Math.PI*2);
  ctx.fill();

  if(playerLoaded){
    const ph=TH*1.85;
    const pw=ph*(PLAYER_IMG.width/PLAYER_IMG.height);
    const dx=sx+TW/2-pw/2;
    const dy=sy+TH-ph+bounce;
    if(player.facing==='left'){
      ctx.save();
      ctx.translate(dx+pw,dy);
      ctx.scale(-1,1);
      ctx.drawImage(PLAYER_IMG,0,0,pw,ph);
      ctx.restore();
    } else {
      ctx.drawImage(PLAYER_IMG,dx,dy,pw,ph);
    }
  } else {
    ctx.font=(TW-4)+'px serif';
    ctx.fillText('🧑',sx+4,sy+TH-4+bounce);
  }
}

// ══ COLLISION ══
function walkable(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  if(RAW_MAP[ty][tx]===1) return false;
  if(OBJECTS.some(o=>o.tx===tx&&o.ty===ty)) return false;
  return true;
}

// ══ MOVEMENT ══
function mv(dir){
  if(moveIv) return;
  doMove(dir);
  moveIv=setInterval(()=>doMove(dir),180);
}
function sm(){ clearInterval(moveIv); moveIv=null; }

function doMove(dir){
  if(!canMove||dlgActive) return;
  let nx=player.tx, ny=player.ty;
  player.facing=dir;
  if(dir==='up') ny--;
  if(dir==='down') ny++;
  if(dir==='left') nx--;
  if(dir==='right') nx++;
  if(walkable(nx,ny)){ player.tx=nx; player.ty=ny; }
}

document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
            w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){e.preventDefault();mv(m[e.key]);}
  if(['Space','Enter','z','Z'].includes(e.code)){e.preventDefault();act();}
});
document.addEventListener('keyup',()=>sm());

// ══ PROXIMITY ══
function getNear(){
  return OBJECTS.find(o=>{
    const dx=Math.abs(player.tx-o.tx);
    const dy=Math.abs(player.ty-o.ty);
    return dx<=2&&dy<=1&&(dx+dy)<=2;
  })||null;
}

// ══ ACTION ══
function act(){
  if(dlgActive){ nextDlg(); return; }
  const near=getNear();
  if(near) interact(near);
}

// ══ INTERACTIONS ══

  switch(obj.id){
    case 'notice':   doNotice(obj); break;
    case 'counter':  doCounter(obj); break;

    case 'kiosk':    doKiosk(obj); break;
  }
}

// ══ DIALOG SYSTEM ══
function showDlg(lines){
  dlgQueue=[...lines];
  dlgActive=true;
  canMove=false;
  nextDlg();
}

let typeTimer=null;
function nextDlg(){
  if(dlgQueue.length===0){ closeDlg(); return; }
  const line=dlgQueue.shift();
  document.getElementById('dlg-spk').textContent=line.sp||'';
  typeTxt('dlg-txt',line.tx,()=>{ if(line.cb) line.cb(); });
  document.getElementById('dialog').style.display='block';
  document.getElementById('dlg-tap').textContent=dlgQueue.length>0?'▼ 點此繼續':'▼ 關閉';
  document.getElementById('dialog').onclick=nextDlg;
}

function typeTxt(elId,text,cb){
  const el=document.getElementById(elId);
  el.textContent='';
  if(typeTimer) clearInterval(typeTimer);
  let i=0;
  typeTimer=setInterval(()=>{
    el.textContent+=text[i]; i++;
    if(i>=text.length){ clearInterval(typeTimer); typeTimer=null; if(cb) cb(); }
  },20);
}

function closeDlg(){
  document.getElementById('dialog').style.display='none';
  dlgActive=false; canMove=true; dlgQueue=[];
}
