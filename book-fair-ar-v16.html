<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>書香・茶香・咖啡香 書展 AR</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
  #container { position: fixed; top:0; left:0; width:100%; height:100%; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 14px 16px; box-sizing: border-box;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
    color: #fff; z-index: 10; pointer-events: none;
  }
  #ui h1 { margin: 0; font-size: 17px; letter-spacing: 1px; }
  #ui p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  #status {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #fff; padding: 8px 18px;
    border-radius: 20px; font-size: 14px; z-index: 10; transition: opacity 0.3s;
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  #status.show { opacity: 1; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 20;
    background: #000; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  #startOverlay h1 { font-size: 20px; margin: 0 0 10px; }
  #startOverlay p { font-size: 14px; opacity: 0.75; margin: 0 0 28px; }
  #startBtn {
    padding: 14px 36px; font-size: 16px; border-radius: 28px; border: none;
    background: #fff; color: #000; font-weight: bold;
  }
  #debugBtn {
    position: fixed; bottom: 24px; right: 16px; z-index: 15;
    padding: 10px 16px; font-size: 13px; border-radius: 20px; border: none;
    background: rgba(255,255,255,0.85); color: #000;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>📖 書香・茶香・咖啡香 書展</h1>
  <p>請點擊下方按鈕啟動相機，接著將鏡頭對準書展中的書封</p>
  <button id="startBtn">▶ 點擊開始 AR</button>
</div>

<div id="ui">
  <h1>📖 書香・茶香・咖啡香 書展</h1>
  <p>請將鏡頭對準書展中的書封</p>
</div>
<div id="container"></div>
<div id="status"></div>
<button id="debugBtn" style="display:none;">🧪 測試特效（不用掃書）</button>
<script>
  window.addEventListener("error", (e) => {
    const overlay = document.getElementById("startOverlay");
    overlay.style.display = "flex";
    overlay.innerHTML =
      '<h1>⚠️ 程式錯誤</h1><p style="color:#ff8080; max-width: 320px; word-break: break-word;">' +
      (e.message || "未知錯誤") +
      "</p>";
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

/* ============================================================
   書單設定：index 必須跟編譯 targets.mind 時「上傳圖片的順序」一致
   category 只能是 'coffee' 或 'tea'（沒有 video 時用預設程序動畫）
   video：若指定，會改用該影片檔做成漂浮卡片，取代預設的咖啡杯/茶杯動畫
   ============================================================ */
const BOOK_CONFIG = [
  { index: 0, title: "咖啡學堂 COFFEE", category: "coffee", video: "./coffee-aroma-effect-v2.mp4" },
  { index: 1, title: "茶飲時光", category: "tea", video: "./coffee-aroma-effect-v2.mp4" },
  { index: 2, title: "台灣咖啡誌", category: "coffee", video: "./coffee-aroma-effect-v2.mp4" },
  { index: 3, title: "咖啡好喝的秘密（Inoda Coffee）", category: "coffee", video: "./coffee-aroma-effect-v2.mp4" },
];

const statusEl = document.getElementById("status");
function showStatus(text) {
  statusEl.textContent = text;
  statusEl.classList.add("show");
}
function hideStatus() {
  statusEl.classList.remove("show");
}

const mindarThree = new MindARThree({
  container: document.querySelector("#container"),
  imageTargetSrc: "./targets.mind", // 用書封照片編譯後放這裡
  maxTrack: 4,
});
const { renderer, scene, camera } = mindarThree;

const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(light);

/* ---------- 自訂影片漂浮卡片（例如你自己做的GIF/影片特效） ---------- */
function createVideoGroup(videoSrc) {
  const group = new THREE.Group();

  const video = document.createElement("video");
  video.src = videoSrc;
  video.crossOrigin = "anonymous";
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.addEventListener("error", () => {
    showStatus(`⚠️ 影片載入失敗: ${videoSrc}`);
  });
  // 部分手機瀏覽器要求影片元素要真的存在於頁面中才能正常解碼播放
  video.style.position = "fixed";
  video.style.width = "1px";
  video.style.height = "1px";
  video.style.opacity = "0";
  video.style.pointerEvents = "none";
  document.body.appendChild(video);
  video.play().catch(() => {});

  const texture = new THREE.VideoTexture(video);
  texture.colorSpace = THREE.SRGBColorSpace;

  const aspect = 9 / 16;
  const height = 1.4; // 放大：0.9 → 1.4
  const width = height * aspect;

  // 用 shader 把接近純白色的背景變透明，只留下有顏色的畫面內容
  const material = new THREE.ShaderMaterial({
    uniforms: {
      map: { value: texture },
      threshold: { value: 0.35 }, // 數值越小，越多接近白色的區域會變透明
      smoothing: { value: 0.15 }, // 邊緣柔化程度，避免鋸齒邊
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D map;
      uniform float threshold;
      uniform float smoothing;
      varying vec2 vUv;
      void main() {
        vec4 color = texture2D(map, vUv);
        float dist = distance(color.rgb, vec3(1.0));
        float alpha = smoothstep(threshold, threshold + smoothing, dist);
        gl_FragColor = vec4(color.rgb, alpha);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide,
  });

  const yOffset = 0.05; // 位置往下移：原本是 height/2+0.15（偏上），改成貼近書封中間偏下
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(width, height),
    material
  );
  plane.position.set(0, yOffset, 0);
  group.add(plane);

  group.userData.update = (t) => {
    plane.position.y = yOffset + Math.sin(t * 1.2) * 0.03;
    plane.rotation.y = Math.sin(t * 0.6) * 0.08;
  };

  return group;
}

/* ---------- 咖啡 AR 群組（預設，沒有指定 video 時使用） ---------- */
function createCoffeeGroup() {
  const group = new THREE.Group();

  const cup = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.22, 0.35, 32),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  cup.position.y = 0.18;
  group.add(cup);

  const coffeeTop = new THREE.Mesh(
    new THREE.CircleGeometry(0.27, 32),
    new THREE.MeshStandardMaterial({ color: 0x3b2418 })
  );
  coffeeTop.rotation.x = -Math.PI / 2;
  coffeeTop.position.y = 0.355;
  group.add(coffeeTop);

  const handle = new THREE.Mesh(
    new THREE.TorusGeometry(0.12, 0.03, 12, 24, Math.PI * 1.2),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  handle.position.set(0.28, 0.18, 0);
  handle.rotation.z = Math.PI / 2.3;
  group.add(handle);

  const beans = [];
  for (let i = 0; i < 6; i++) {
    const bean = new THREE.Mesh(
      new THREE.SphereGeometry(0.045, 10, 10),
      new THREE.MeshStandardMaterial({ color: 0x4a2c17 })
    );
    bean.scale.set(1, 0.7, 0.55);
    const angle = (i / 6) * Math.PI * 2;
    bean.userData.angle = angle;
    bean.userData.radius = 0.55 + Math.random() * 0.15;
    bean.userData.speed = 0.4 + Math.random() * 0.3;
    bean.userData.yOff = Math.random() * Math.PI * 2;
    group.add(bean);
    beans.push(bean);
  }

  const steam = createSteam(0xffffff, 0.35);
  group.add(steam);

  group.userData.update = (t) => {
    beans.forEach((b) => {
      const a = b.userData.angle + t * b.userData.speed;
      b.position.set(
        Math.cos(a) * b.userData.radius,
        0.4 + Math.sin(t * 1.5 + b.userData.yOff) * 0.08,
        Math.sin(a) * b.userData.radius
      );
      b.rotation.y = a;
    });
    updateSteam(steam, t);
  };

  return group;
}

/* ---------- 茶 AR 群組（預設，沒有指定 video 時使用） ---------- */
function createTeaGroup() {
  const group = new THREE.Group();

  const cup = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.2, 0.22, 32),
    new THREE.MeshStandardMaterial({ color: 0xf5f0e6 })
  );
  cup.position.y = 0.11;
  group.add(cup);

  const tea = new THREE.Mesh(
    new THREE.CircleGeometry(0.29, 32),
    new THREE.MeshStandardMaterial({ color: 0x7a5230 })
  );
  tea.rotation.x = -Math.PI / 2;
  tea.position.y = 0.221;
  group.add(tea);

  const saucer = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.42, 0.02, 32),
    new THREE.MeshStandardMaterial({ color: 0xf5f0e6 })
  );
  saucer.position.y = 0.0;
  group.add(saucer);

  const leaves = [];
  for (let i = 0; i < 8; i++) {
    const leaf = new THREE.Mesh(
      new THREE.CircleGeometry(0.05, 8),
      new THREE.MeshStandardMaterial({ color: 0x4f7942, side: THREE.DoubleSide })
    );
    leaf.scale.set(1, 1.8, 1);
    const angle = (i / 8) * Math.PI * 2;
    leaf.userData.angle = angle;
    leaf.userData.radius = 0.5 + Math.random() * 0.2;
    leaf.userData.speed = 0.3 + Math.random() * 0.3;
    leaf.userData.yOff = Math.random() * Math.PI * 2;
    group.add(leaf);
    leaves.push(leaf);
  }

  const steam = createSteam(0xffffff, 0.22);
  group.add(steam);

  group.userData.update = (t) => {
    leaves.forEach((l) => {
      const a = l.userData.angle + t * l.userData.speed;
      l.position.set(
        Math.cos(a) * l.userData.radius,
        0.35 + Math.sin(t * 1.3 + l.userData.yOff) * 0.1,
        Math.sin(a) * l.userData.radius
      );
      l.rotation.y = a;
      l.rotation.z = Math.sin(t * 2 + l.userData.yOff) * 0.5;
    });
    updateSteam(steam, t);
  };

  return group;
}

/* ---------- 共用：熱氣粒子 ---------- */
function createSteam(color, baseY) {
  const count = 40;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 0.1;
    positions[i * 3 + 1] = baseY;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
    seeds[i] = Math.random() * 10;
  }
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.userData.seeds = seeds;
  geo.userData.baseY = baseY;
  const mat = new THREE.PointsMaterial({
    color, size: 0.03, transparent: true, opacity: 0.55, depthWrite: false,
  });
  return new THREE.Points(geo, mat);
}
function updateSteam(points, t) {
  const pos = points.geometry.attributes.position;
  const seeds = points.geometry.userData.seeds;
  const baseY = points.geometry.userData.baseY;
  for (let i = 0; i < pos.count; i++) {
    const seed = seeds[i];
    const life = (t * 0.4 + seed) % 2;
    pos.setY(i, baseY + life * 0.45);
    pos.setX(i, Math.sin(t * 2 + seed) * 0.06);
    pos.setZ(i, Math.cos(t * 2 + seed) * 0.06);
  }
  pos.needsUpdate = true;
  points.material.opacity = 0.55 * (1 - ((t * 0.4) % 1));
}

/* ---------- 依 BOOK_CONFIG 建立每個 anchor ---------- */
const groups = [];
BOOK_CONFIG.forEach((book) => {
  const anchor = mindarThree.addAnchor(book.index);
  let group;
  if (book.video) {
    group = createVideoGroup(book.video);
  } else {
    group = book.category === "tea" ? createTeaGroup() : createCoffeeGroup();
  }
  anchor.group.add(group);
  groups.push(group);

  anchor.onTargetFound = () => {
    showStatus(`☕🍵 ${book.title}（${book.category === "tea" ? "茶香" : "咖啡香"}）`);
  };
  anchor.onTargetLost = () => {
    hideStatus();
  };
});

// 測試用按鈕：直接把第一組卡片放在鏡頭正前方，不用掃書封也能看到效果
const debugBtn = document.getElementById("debugBtn");
if (BOOK_CONFIG.some((b) => b.video)) {
  const debugGroup = createVideoGroup(BOOK_CONFIG.find((b) => b.video).video);
  debugGroup.position.set(0, 0, -1.2);
  debugGroup.visible = false;
  camera.add(debugGroup);
  scene.add(camera);

  debugBtn.style.display = "block";
  let debugShowing = false;
  debugBtn.addEventListener("click", () => {
    debugShowing = !debugShowing;
    debugGroup.visible = debugShowing;
    debugBtn.textContent = debugShowing ? "🧪 關閉測試特效" : "🧪 測試特效（不用掃書）";
  });
}

const clock = new THREE.Clock();
const start = async () => {
  try {
    await mindarThree.start();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      groups.forEach((g) => g.userData.update && g.userData.update(t));
      renderer.render(scene, camera);
    });
  } catch (err) {
    document.getElementById("startOverlay").style.display = "flex";
    document.getElementById("startOverlay").innerHTML =
      '<h1>⚠️ 啟動失敗</h1><p style="color:#ff8080; max-width: 320px; word-break: break-word;">' +
      (err && err.message ? err.message : String(err)) +
      "</p>";
  }
};

// iPhone Safari 等瀏覽器要求「使用者手動點擊」才能啟動相機，
// 所以改成點擊按鈕後才呼叫 start()，而不是網頁一載入就自動要求相機權限
document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("startOverlay").style.display = "none";
  start();
});
</script>
</body>
</html>
