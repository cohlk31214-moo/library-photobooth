<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>動線導引 AR - 尋書路徑</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 20;
    background: #000; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  #startOverlay h1 { font-size: 20px; margin: 0 0 10px; }
  #startOverlay p { font-size: 18px; line-height: 1.6; opacity: 0.85; margin: 0 0 28px; }
  #startBtn {
    padding: 14px 36px; font-size: 16px; border-radius: 28px; border: none;
    background: #fff; color: #000; font-weight: bold;
  }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 14px 16px; box-sizing: border-box;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
    color: #fff; z-index: 10; pointer-events: none;
  }
  #ui h1 { margin: 0; font-size: 17px; letter-spacing: 1px; }
  #ui p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  #status {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #fff; padding: 8px 18px;
    border-radius: 20px; font-size: 14px; z-index: 10; transition: opacity 0.3s;
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  #status.show { opacity: 1; }
  .a-enter-vr, .a-orientation-modal { display: none !important; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>🧭 尋書動線導引</h1>
  <p>請點擊下方按鈕啟動相機，<br>接著將鏡頭對準指定的標記圖</p>
  <button id="startBtn">▶ 點擊開始 AR</button>
</div>

<div id="ui">
  <h1>🧭 尋書動線導引</h1>
  <p>請將鏡頭對準標記圖</p>
</div>
<div id="status"></div>

<a-scene
  id="arScene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
  style="width:100%; height:100%;"
>
  <a-assets>
    <img id="foot1" src="./foot-1-green.png" crossorigin="anonymous">
    <img id="foot2" src="./foot-2-blue.png" crossorigin="anonymous">
    <img id="foot3" src="./foot-3-orange.png" crossorigin="anonymous">
    <img id="foot4" src="./foot-4-pink.png" crossorigin="anonymous">
    <img id="foot5" src="./foot-5-orangered.png" crossorigin="anonymous">
    <img id="foot6" src="./foot-6-green.png" crossorigin="anonymous">
    <img id="arrowTex" src="./arrow.png" crossorigin="anonymous">
    <img id="pinTex" src="./pin.png" crossorigin="anonymous">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="pathAnchor">

    <!-- ============================================================
         路徑設定：這裡先做 6 個測試腳印，沿著一條簡單斜線走
         之後要換成正式路徑，只要改每個 a-image 的 position 就好
         單位是「相對於 target image 的世界座標」，1 大約等於 target 原圖寬度
         ============================================================ -->

    <!-- 腳印 1~6：依序淡入＋放大播放，套用你設計的彩色腳印圖檔 -->
    <a-image class="footstep" src="#foot1"
      position="0 0 0" rotation="-90 0 0" width="0.107" height="0.2"
      material="transparent: true; opacity: 0" data-step="0"></a-image>

    <a-image class="footstep" src="#foot2"
      position="0.15 0 -0.25" rotation="-90 0 10" width="0.098" height="0.2"
      material="transparent: true; opacity: 0" data-step="1"></a-image>

    <a-image class="footstep" src="#foot3"
      position="0.05 0 -0.5" rotation="-90 0 -5" width="0.098" height="0.2"
      material="transparent: true; opacity: 0" data-step="2"></a-image>

    <a-image class="footstep" src="#foot4"
      position="0.2 0 -0.75" rotation="-90 0 15" width="0.118" height="0.2"
      material="transparent: true; opacity: 0" data-step="3"></a-image>

    <a-image class="footstep" src="#foot5"
      position="0.1 0 -1.0" rotation="-90 0 -8" width="0.122" height="0.2"
      material="transparent: true; opacity: 0" data-step="4"></a-image>

    <a-image class="footstep" src="#foot6"
      position="0.25 0 -1.25" rotation="-90 0 12" width="0.107" height="0.2"
      material="transparent: true; opacity: 0" data-step="5"></a-image>

    <!-- 方向箭頭：最後一個腳印之後出現 -->
    <a-image id="arrowIcon" src="#arrowTex"
      position="0.25 0.15 -1.5" rotation="-90 0 0" width="0.18" height="0.18"
      material="transparent: true; opacity: 0"></a-image>

    <!-- 終點圖示 + 文字 -->
    <a-image id="pinIcon" src="#pinTex"
      position="0.25 0.3 -1.85" width="0.16" height="0.16"
      material="transparent: true; opacity: 0"
      look-at="[camera]"></a-image>

    <a-text id="destText" value="找到囉！"
      position="0.25 0.12 -1.85" align="center" width="1.4"
      color="#ffffff" side="double"
      material="transparent: true; opacity: 0; shader: msdf;"
      look-at="[camera]"></a-text>

  </a-entity>
</a-scene>

<script>
  const statusEl = document.getElementById("status");
  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.classList.add("show");
  }
  function hideStatus() {
    statusEl.classList.remove("show");
  }

  const sceneEl = document.getElementById("arScene");
  const anchor = document.getElementById("pathAnchor");
  const footsteps = Array.from(document.querySelectorAll(".footstep"))
    .sort((a, b) => a.dataset.step - b.dataset.step);
  const arrowIcon = document.getElementById("arrowIcon");
  const pinIcon = document.getElementById("pinIcon");
  const destText = document.getElementById("destText");

  const STEP_DELAY = 500; // 每個腳印間隔（毫秒），對應需求「約0.5秒後下一個」
  let animTimers = [];

  function resetPath() {
    animTimers.forEach((id) => clearTimeout(id));
    animTimers = [];
    [...footsteps, arrowIcon, pinIcon, destText].forEach((el) => {
      el.removeAttribute("animation__fade");
      el.removeAttribute("animation__scale");
      el.setAttribute("material", "opacity", 0);
    });
  }

  function playPath() {
    resetPath();
    footsteps.forEach((el, i) => {
      const t = setTimeout(() => {
        el.setAttribute("animation__fade", {
          property: "material.opacity",
          from: 0, to: 0.95, dur: 350, easing: "easeOutQuad",
        });
        el.setAttribute("animation__scale", {
          property: "scale",
          from: "0.6 0.6 0.6", to: "1 1 1", dur: 350, easing: "easeOutBack",
        });
      }, i * STEP_DELAY);
      animTimers.push(t);
    });

    const afterFootsteps = footsteps.length * STEP_DELAY;

    const tArrow = setTimeout(() => {
      arrowIcon.setAttribute("animation__fade", {
        property: "material.opacity", from: 0, to: 1, dur: 400,
      });
      arrowIcon.setAttribute("animation__scale", {
        property: "scale", from: "0.5 0.5 0.5", to: "1 1 1", dur: 400, easing: "easeOutBack",
      });
    }, afterFootsteps + 200);
    animTimers.push(tArrow);

    const tDest = setTimeout(() => {
      pinIcon.setAttribute("animation__fade", {
        property: "material.opacity", from: 0, to: 1, dur: 400,
      });
      destText.setAttribute("animation__fade", {
        property: "material.opacity", from: 0, to: 1, dur: 400,
      });
    }, afterFootsteps + 700);
    animTimers.push(tDest);
  }

  anchor.addEventListener("targetFound", () => {
    showStatus("🧭 已找到標記，開始導引");
    playPath();
  });
  anchor.addEventListener("targetLost", () => {
    hideStatus();
    resetPath();
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    document.getElementById("startOverlay").style.display = "none";
    const mindarSystem = sceneEl.systems["mindar-image-system"];
    mindarSystem.start();
  });

  window.addEventListener("error", (e) => {
    const overlay = document.getElementById("startOverlay");
    overlay.style.display = "flex";
    overlay.innerHTML =
      '<h1>⚠️ 程式錯誤</h1><p style="color:#ff8080; max-width: 320px; word-break: break-word;">' +
      (e.message || "未知錯誤") + "</p>";
  });
</script>
</body>
</html>
