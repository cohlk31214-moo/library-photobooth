<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>動線導引 AR - 分類方向指引</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000; font-family: sans-serif;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; padding: 18px 36px; font-size: 20px; font-weight: bold;
    background: #ff2d78; color: #fff; border: none; border-radius: 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 15; color: #fff; background: rgba(0,0,0,0.55); padding: 8px 16px;
    border-radius: 20px; font-size: 14px; display: none;
  }
  #statusBox {
    position: fixed; top: 8px; left: 8px; z-index: 998;
    color: #0f0; background: rgba(0,0,0,0.6); padding: 6px 10px;
    border-radius: 8px; font-size: 12px; font-family: monospace;
  }
  #errBox {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: rgba(255,0,0,0.85); color: #fff; font-size: 12px;
    padding: 8px; display: none; white-space: pre-wrap; word-break: break-all;
  }
  video:not(.assetVideo) {
    position: fixed !important; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
    object-fit: cover; z-index: 1 !important;
  }
  canvas.mindar-canvas {
    position: fixed !important; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
    z-index: 2 !important;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<button id="startBtn">點擊開始 AR 導覽</button>
<div id="hint">請將鏡頭對準指標圖片</div>
<div id="statusBox">狀態: 尚未啟動</div>
<div id="errBox"></div>

<script>
  function showErr(msg) {
    var box = document.getElementById("errBox");
    box.style.display = "block";
    box.textContent = "錯誤: " + msg;
  }
  window.addEventListener("error", function (e) {
    showErr(e.message + " (" + e.filename + ":" + e.lineno + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = (reason && (reason.message || reason.toString())) || String(reason);
    showErr("[非同步] " + msg);
  });
</script>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

let mindarThree = null;
let started = false;

function setStatus(msg) {
  const box = document.getElementById("statusBox");
  if (box) box.textContent = "狀態: " + msg;
}

// 強制修正MindAR產生的攝影機畫面/畫布，避免任何外層容器造成的黑邊
function forceFullscreenFix() {
  function apply(el) {
    el.style.setProperty("position", "fixed", "important");
    el.style.setProperty("top", "0", "important");
    el.style.setProperty("left", "0", "important");
    el.style.setProperty("width", "100vw", "important");
    el.style.setProperty("height", "100vh", "important");
    el.style.setProperty("max-width", "none", "important");
    el.style.setProperty("max-height", "none", "important");
    el.style.setProperty("transform", "none", "important");
    el.style.setProperty("object-fit", "cover", "important");
  }
  const video = document.querySelector("video:not(.assetVideo)");
  const canvas = document.querySelector("canvas");
  if (canvas) canvas.classList.add("mindar-canvas");
  [video, canvas].forEach((el) => {
    if (!el) return;
    apply(el);
    let node = el.parentElement;
    while (node && node !== document.body) {
      node.style.setProperty("transform", "none", "important");
      node.style.setProperty("position", "static", "important");
      node.style.setProperty("width", "100%", "important");
      node.style.setProperty("height", "100%", "important");
      node.style.setProperty("max-width", "none", "important");
      node = node.parentElement;
    }
  });
}

// ---- 4個方向指標設定 ----
// x: 正值=畫面右邊，負值=畫面左邊；y: 高度；z: 深度
// direction: "left" 或 "right"，決定箭頭指向與文字排列方向
const DIRECTIONS = [
  { color: "#FF6400", text: "5.館藏特色區", direction: "left", x: -0.40, y: 0.32, z: 0, scale: 1.0 },
  { color: "#009600", text: "9.藝術", direction: "right", x: -0.06, y: 0.32, z: 0, scale: 1.0 },
  { color: "#B4001E", text: "8.藝術", direction: "right", x: 0.10, y: 0.32, z: 0.001, scale: 0.75 },
  { color: "#820032", text: "0.總類", direction: "right", x: 0.24, y: 0.32, z: 0.002, scale: 0.55 },
];
const ARROW_WORLD_HEIGHT = 0.16;
const CANVAS_W = 520;
const CANVAS_H = 220;

function hexToRgb(hex) {
  const v = hex.replace("#", "");
  return [parseInt(v.substring(0, 2), 16), parseInt(v.substring(2, 4), 16), parseInt(v.substring(4, 6), 16)];
}

// 畫出「箭頭形狀本體」(圓角矩形身體+三角形箭頭尖)，body/point合為一體，文字由外部另外疊加
function drawArrowShape(ctx, color, alpha, direction) {
  const [r, g, b] = hexToRgb(color);
  ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
  const marginY = CANVAS_H * 0.14;
  const bodyH = CANVAS_H - marginY * 2;
  const pointLen = CANVAS_W * 0.24;
  const overlapIntoBody = pointLen * 0.35; // 三角形底邊稍微疊進body裡，避免接縫
  const bodyW = CANVAS_W - pointLen + overlapIntoBody;

  ctx.save();
  if (direction === "left") {
    ctx.translate(CANVAS_W, 0);
    ctx.scale(-1, 1);
  }
  // 身體：左側圓角，右側直角(被三角形蓋住接縫)
  const radius = bodyH * 0.28;
  ctx.beginPath();
  ctx.moveTo(radius, marginY);
  ctx.lineTo(bodyW, marginY);
  ctx.lineTo(bodyW, marginY + bodyH);
  ctx.lineTo(radius, marginY + bodyH);
  ctx.quadraticCurveTo(0, marginY + bodyH, 0, marginY + bodyH - radius);
  ctx.lineTo(0, marginY + radius);
  ctx.quadraticCurveTo(0, marginY, radius, marginY);
  ctx.closePath();
  ctx.fill();
  // 箭頭尖
  ctx.beginPath();
  ctx.moveTo(bodyW - overlapIntoBody, marginY);
  ctx.lineTo(bodyW - overlapIntoBody + pointLen, CANVAS_H / 2);
  ctx.lineTo(bodyW - overlapIntoBody, marginY + bodyH);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  return { bodyW, marginY, bodyH };
}

// 繪製「箭頭本體忽亮忽暗、往前跳動」的效果；文字固定疊在最上層、不參與閃爍，維持清楚可讀
function drawChevronFrame(ctx, color, text, direction, phase) {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // 3層微微前移的殘影，用亮度輪流變化製造往前跳動的閃爍感
  const brightness = [1.0, 0.4, 0.18];
  const staggerPx = 10;
  for (let i = 0; i < 3; i++) {
    const level = brightness[(i - phase + 30) % 3];
    ctx.save();
    const dx = direction === "left" ? -i * staggerPx : i * staggerPx;
    ctx.translate(dx, 0);
    drawArrowShape(ctx, color, level, direction);
    ctx.restore();
  }

  // 文字：固定在基準位置，永遠全不透明，不跟著閃爍
  const geo = (function () {
    const marginY = CANVAS_H * 0.14;
    const bodyH = CANVAS_H - marginY * 2;
    const pointLen = CANVAS_W * 0.24;
    const overlapIntoBody = pointLen * 0.35;
    const bodyW = CANVAS_W - pointLen + overlapIntoBody;
    return { bodyW };
  })();
  ctx.font = "bold 44px 'Noto Sans TC', sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const textX = direction === "left" ? CANVAS_W - geo.bodyW / 2 : geo.bodyW / 2;
  ctx.fillText(text, textX, CANVAS_H / 2);
}

async function startAR() {
  if (started) return;
  started = true;

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("hint").style.display = "block";
  setStatus("初始化 MindAR...");

  mindarThree = new MindARThree({
    container: document.body,
    imageTargetSrc: "./wayfinding-station3-targets.mind",
    filterMinCF: 0.00005,
    filterBeta: 0.0005,
    uiScanning: false,
  });

  const { renderer, scene, camera } = mindarThree;
  renderer.setClearColor(0x000000, 0);

  // 每個方向各自建立一個canvas畫布 + CanvasTexture，動畫時只更新畫布內容
  function buildItem(cfg) {
    const canvas = document.createElement("canvas");
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    const ctx = canvas.getContext("2d");
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;

    const aspect = CANVAS_W / CANVAS_H;
    const h = ARROW_WORLD_HEIGHT * (cfg.scale || 1);
    const w = h * aspect;
    const geometry = new THREE.PlaneGeometry(w, h);
    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(cfg.x, cfg.y, cfg.z);

    return { cfg, canvas, ctx, texture, mesh };
  }

  const anchorIndices = [0, 1, 2]; // 這3個角度的照片都對應同一組方向指引
  const allItemGroups = []; // 每個anchor各自一組獨立的mesh(材質/畫布各自獨立，避免共用mesh造成的錯誤)

  const anchors = anchorIndices.map((idx) => {
    const anchor = mindarThree.addAnchor(idx);
    const items = DIRECTIONS.map((cfg) => buildItem(cfg));
    items.forEach((item) => anchor.group.add(item.mesh));
    allItemGroups.push(items);

    anchor.onTargetFound = () => {
      document.getElementById("hint").style.display = "none";
      setStatus("已偵測到目標，顯示4個方向指引");
    };
    anchor.onTargetLost = () => {
      document.getElementById("hint").style.display = "block";
      setStatus("鏡頭運作中，掃描目標中...");
    };

    return anchor;
  });

  let phase = 0;
  let lastPhaseTime = performance.now();
  const PHASE_INTERVAL_MS = 280; // 每隔多久切換一次顏色相位，決定流動速度

  function redrawAll() {
    allItemGroups.forEach((items) => {
      items.forEach((item) => {
        drawChevronFrame(item.ctx, item.cfg.color, item.cfg.text, item.cfg.direction, phase);
        item.texture.needsUpdate = true;
      });
    });
  }

  function updateArrows() {
    const now = performance.now();
    if (now - lastPhaseTime > PHASE_INTERVAL_MS) {
      phase = (phase + 1) % 3;
      lastPhaseTime = now;
      redrawAll();
    }
  }

  redrawAll(); // 先畫出初始畫面

  try {
    await mindarThree.start();
    setStatus("鏡頭運作中，掃描目標中...");
    forceFullscreenFix();
    setTimeout(forceFullscreenFix, 300);
    setTimeout(forceFullscreenFix, 1000);
    window.addEventListener("resize", forceFullscreenFix);
    window.addEventListener("orientationchange", forceFullscreenFix);
  } catch (err) {
    showErr("[MindAR啟動失敗] " + (err && (err.message || err.toString())));
    setStatus("啟動失敗");
    document.getElementById("startBtn").style.display = "block";
    document.getElementById("hint").style.display = "none";
    started = false;
    return;
  }

  renderer.setAnimationLoop(() => {
    updateArrows();
    renderer.render(scene, camera);
  });
}

document.getElementById("startBtn").addEventListener("click", startAR);
</script>

</body>
</html>
