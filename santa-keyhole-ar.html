<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>兒童室 AR 尋書大冒險｜聖誕鑰匙孔</title>

<!--
  =====================================================================
  使用說明（給圖書館工作人員 / 開發者）
  =====================================================================
  1. 這個頁面用的是 MindAR (image tracking)。你需要把「trigger 圖片」
     （建議使用一起提供的 keyhole-trigger.png，已加上星星、外框、文字
     等豐富細節，方便 MindAR 辨識；純黑色鑰匙孔剪影細節太少，容易認不到）
     拿去官方線上編譯工具轉成 .mind 檔：
         https://hiukim.github.io/mind-ar-js-doc/tools/compile
     編譯完成後下載 targets.mind，和這個 html 放在同一個 GitHub 資料夾。

  2. 下面 <a-scene mindar-image="imageTargetSrc: ./targets.mind ...">
     這一行的路徑要跟你上傳的 targets.mind 檔名/路徑一致。

  3. 把 keyhole-trigger.png 實際印出來，貼在「兒童室入口正中央」
     （對應你給的參考圖1構圖：鑰匙孔在拱門中間）。

  4. 第三步的「尋寶線索畫面」目前是預留的範例文字（因為你目前還沒
     提供圖3的實際內容），請直接修改下面 CLUE_HTML 這個變數，
     换成你真正想給讀者的線索/分類提示文字或圖片。

  5. 動畫流程：掃到鑰匙孔 → 鑰匙從右側滑入 → 鑰匙孔變黑（鎖上）→
     畫面全白閃一下 → 淡出後顯示尋寶線索卡片。
  =====================================================================
-->

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  :root{
    --xmas-red:#d6203f;
    --xmas-green:#146e46;
    --xmas-gold:#e6c15a;
    --cream:#fffdf7;
  }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
    background:#000;
  }
  a-scene{ position:fixed; inset:0; z-index:1; }

  /* ---------- 頂部提示橫幅（掃描階段） ---------- */
  #topBanner{
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
    text-align:center; color:var(--cream);
    background:linear-gradient(180deg, rgba(20,20,20,.65), rgba(20,20,20,0));
    pointer-events:none;
  }
  #topBanner h1{
    margin:0; font-size:18px; letter-spacing:1px;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #topBanner p{
    margin:6px 0 0; font-size:13px; opacity:.9;
  }
  .snow-emoji{ display:inline-block; animation:snowSway 3s ease-in-out infinite; }
  @keyframes snowSway{
    0%,100%{ transform:translateY(0) rotate(-6deg);}
    50%{ transform:translateY(-4px) rotate(6deg);}
  }

  /* ---------- 開始畫面 ---------- */
  #startScreen{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, #1c3b2e 0%, #0c1712 70%);
    color:var(--cream); text-align:center; padding:24px; box-sizing:border-box;
  }
  #startScreen .deco{ font-size:46px; margin-bottom:6px; }
  #startScreen h1{ font-size:24px; margin:0 0 10px; }
  #startScreen p{ font-size:14px; line-height:1.7; opacity:.9; max-width:320px; margin:0 auto 26px; }
  #startBtn{
    padding:14px 34px; font-size:17px; font-weight:bold;
    border:none; border-radius:999px; cursor:pointer;
    background:linear-gradient(135deg, var(--xmas-red), #a4162f);
    color:#fff; box-shadow:0 8px 20px rgba(214,32,63,.45);
    transition:transform .15s ease;
  }
  #startBtn:active{ transform:scale(.96); }
  #permHint{ margin-top:16px; font-size:12px; opacity:.65; max-width:280px; }

  /* ---------- 掃描中提示外框 ---------- */
  #scanHint{
    position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    z-index:20; color:var(--cream); font-size:13px; text-align:center;
    background:rgba(0,0,0,.45); padding:8px 16px; border-radius:999px;
    pointer-events:none; opacity:0; transition:opacity .3s ease;
  }
  #scanHint.show{ opacity:1; }

  /* ---------- 白閃效果 ---------- */
  #flash{
    position:fixed; inset:0; z-index:80;
    background:#fff; opacity:0; pointer-events:none;
  }

  /* ---------- 尋寶線索卡片 ---------- */
  #clueScreen{
    position:fixed; inset:0; z-index:70;
    display:none; align-items:center; justify-content:center;
    padding:24px; box-sizing:border-box;
    background:radial-gradient(circle at 50% 10%, #24483a 0%, #0c1712 75%);
  }
  #clueCard{
    width:100%; max-width:380px;
    background:var(--cream); border-radius:22px; padding:26px 22px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    text-align:center; position:relative;
    border:3px solid var(--xmas-gold);
    animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes popIn{
    0%{ transform:scale(.7); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  #clueCard .badge{ font-size:44px; margin-bottom:6px; }
  #clueCard h2{ margin:0 0 4px; color:var(--xmas-red); font-size:20px; }
  #clueCard h3{ margin:0 0 14px; color:var(--xmas-green); font-size:15px; font-weight:600; }
  #clueCard .callno{
    display:inline-block; margin:6px 0 16px; padding:6px 14px;
    background:var(--xmas-green); color:#fff; border-radius:8px;
    font-weight:bold; letter-spacing:1px; font-size:15px;
  }
  #clueCard p{ font-size:14px; line-height:1.8; color:#333; margin:0 0 6px; text-align:left; }
  #againBtn{
    margin-top:18px; padding:11px 26px; font-size:14px; font-weight:bold;
    border:none; border-radius:999px; cursor:pointer;
    background:var(--xmas-red); color:#fff;
  }

  /* 裝飾雪花飄浮（輕量、不擋鏡頭中央） */
  .float-deco{
    position:fixed; z-index:15; pointer-events:none; font-size:22px; opacity:.55;
    animation:floatUpDown 4s ease-in-out infinite;
  }
  @keyframes floatUpDown{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-14px); }
  }
</style>
</head>
<body>

<!-- 開始畫面：先取得相機權限再啟動 AR，符合 iOS Safari 要求 -->
<div id="startScreen">
  <div class="deco">🎅🔑</div>
  <h1>兒童室聖誕尋寶大冒險</h1>
  <p>
    請把手機鏡頭對準兒童室入口的「聖誕鑰匙孔」立牌，<br>
    看看聖誕老公公為你準備了什麼任務！
  </p>
  <button id="startBtn">開始 AR 尋寶</button>
  <div id="permHint">點擊後請允許使用相機權限</div>
</div>

<div id="topBanner">
  <h1><span class="snow-emoji">🎄</span> AR 尋書闖關大冒險 <span class="snow-emoji">🎁</span></h1>
  <p>請將鏡頭對準兒童室入口的鑰匙孔圖示</p>
</div>

<div id="scanHint">🔍 掃描中，請對準鑰匙孔標誌…</div>

<!-- ============== MindAR 場景 ============== -->

  vr-mode-ui="enabled: false"

    <img id="keyholeLockedTex" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMDAgNDIwIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZ29sZDIiIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPgogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjZmZlOWE2Ii8+CiAgICAgIDxzdG9wIG9mZnNldD0iMTAwJSIgc3RvcC1jb2xvcj0iI2NhYTAzZSIvPgogICAgPC9saW5lYXJHcmFkaWVudD4KICA8L2RlZnM+CiAgPGNpcmNsZSBjeD0iMTUwIiBjeT0iMTUwIiByPSI4NiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ1cmwoI2dvbGQyKSIgc3Ryb2tlLXdpZHRoPSI4Ii8+CiAgPGNpcmNsZSBjeD0iMTUwIiBjeT0iMTUwIiByPSI3NCIgZmlsbD0iIzExMTExMSIvPgogIDxwb2x5Z29uIHBvaW50cz0iMTMyLDE3NiAxNjgsMTc2IDE4MiwyNTggMTE4LDI1OCIgZmlsbD0iIzExMTExMSIvPgo8L3N2Zz4=">

  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false" raycaster="far: 10000; objects: .clickable"></a-camera>

  <a-entity id="target0" mindar-image-target="targetIndex: 0">
    <!-- 鑰匙孔（開鎖狀態） -->
    <a-image id="keyholeImg"
      src="#keyholeOpenTex"
      position="0 0 0" rotation="0 0 0"
      width="0.5" height="0.7"
      transparent="true" alpha-test="0.05">
    </a-image>

    <!-- 鑰匙（從右側滑入） -->
    <a-image id="keyImg"
      src="#keyTex"
      position="0.75 -0.02 0.02" rotation="0 0 0"
      width="0.55" height="0.24"
      transparent="true" alpha-test="0.05">
    </a-image>
  </a-entity>
</a-scene>

<div id="flash"></div>

<!-- ============== 尋寶線索畫面（範例內容，請自行替換） ============== -->
<div id="clueScreen">
  <div id="clueCard">
    <div class="badge">🎁</div>
    <h2>叮咚！大門打開了</h2>
    <h3>聖誕老公公的第一個任務：</h3>
    <div class="callno">000－099</div>
    <p>
      聖誕老公公說：「北極秘密基地的地圖，
      藏在圖書館最厲害的『百科全書』裡！」<br><br>
      請你到<strong>總類（0類）書架</strong>，
      找一本封面有地球或地圖圖案的書，
      翻開目錄，看看第一個線索是不是在等你？
    </p>
    <button id="againBtn">再玩一次</button>
  </div>
</div>

<!-- 飄浮裝飾（純視覺，不擋鏡頭） -->
<div class="float-deco" style="top:14%; left:6%; animation-delay:.2s;">❄️</div>
<div class="float-deco" style="top:22%; right:8%; animation-delay:1.1s;">⭐</div>
<div class="float-deco" style="bottom:18%; left:10%; animation-delay:.6s;">🔔</div>

<script>
(function(){
  const startScreen = document.getElementById('startScreen');
  const startBtn     = document.getElementById('startBtn');
  const scene        = document.getElementById('arScene');
  const scanHint     = document.getElementById('scanHint');
  const target0      = document.getElementById('target0');
  const keyholeImg   = document.getElementById('keyholeImg');
  const keyImg       = document.getElementById('keyImg');
  const flash        = document.getElementById('flash');
  const clueScreen   = document.getElementById('clueScreen');
  const againBtn     = document.getElementById('againBtn');
  const topBanner    = document.getElementById('topBanner');

  let sequenceRunning = false;
  let sequenceDone = false;
  let rafId = null;

  // ---- 動畫參數 ----
  const SLIDE_MS = 1100;      // 鑰匙滑入時間
  const TURN_MS  = 350;       // 鑰匙孔轉黑動畫時間
  const FLASH_IN_MS = 160;    // 白閃 淡入
  const FLASH_HOLD_MS = 160;  // 白閃 停留
  const FLASH_OUT_MS = 420;   // 白閃 淡出

  function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

  function resetSequence(){
    sequenceRunning = false;
    sequenceDone = false;
    if(rafId) cancelAnimationFrame(rafId);
    keyImg.setAttribute('position', '0.75 -0.02 0.02');
    keyImg.setAttribute('rotation', '0 0 0');
    keyholeImg.setAttribute('src', '#keyholeOpenTex');
    flash.style.opacity = 0;
    clueScreen.style.display = 'none';
  }

  function runInsertSequence(){
    if(sequenceRunning || sequenceDone) return;
    sequenceRunning = true;
    const start = performance.now();

    function tick(now){
      const t = Math.min(1, (now - start) / SLIDE_MS);
      const e = easeOutCubic(t);
      const x = 0.75 - e * 0.75; // 滑到 x=0
      keyImg.setAttribute('position', `${x} -0.02 0.02`);

      if(t < 1){
        rafId = requestAnimationFrame(tick);
      } else {
        // 到位：鑰匙轉動 + 鑰匙孔變黑（鎖上）
        keyImg.setAttribute('animation__turn',
          `property: rotation; to: 0 0 -35; dur: ${TURN_MS}; easing: easeInOutQuad`);
        keyholeImg.setAttribute('src', '#keyholeLockedTex');

        setTimeout(triggerFlash, TURN_MS + 120);
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function triggerFlash(){
    flash.style.transition = `opacity ${FLASH_IN_MS}ms ease-in`;
    flash.style.opacity = 1;
    setTimeout(() => {
      flash.style.transition = `opacity ${FLASH_OUT_MS}ms ease-out`;
      flash.style.opacity = 0;
      showClueScreen();
    }, FLASH_IN_MS + FLASH_HOLD_MS);
  }

  function showClueScreen(){
    sequenceDone = true;
    topBanner.style.display = 'none';
    scanHint.classList.remove('show');
    clueScreen.style.display = 'flex';
  }

  // ---- MindAR 事件 ----
  target0.addEventListener('targetFound', () => {
    scanHint.classList.remove('show');
    if(!sequenceDone){
      runInsertSequence();
    }
  });

  target0.addEventListener('targetLost', () => {
    if(!sequenceDone){
      // 掃描中途鏡頭移開：重置，讓讀者可以重新對準再玩一次
      if(rafId) cancelAnimationFrame(rafId);
      sequenceRunning = false;
      keyImg.setAttribute('position', '0.75 -0.02 0.02');
      keyImg.setAttribute('rotation', '0 0 0');
      keyholeImg.setAttribute('src', '#keyholeOpenTex');
    }
    scanHint.classList.add('show');
  });

  // ---- 啟動流程 ----
  startBtn.addEventListener('click', async () => {
    startScreen.style.display = 'none';
    scanHint.classList.add('show');
    const sceneEl = scene;
    if(sceneEl.hasLoaded){
      sceneEl.systems['mindar-image-system'].start();
    } else {
      sceneEl.addEventListener('loaded', () => {
        sceneEl.systems['mindar-image-system'].start();
      });
    }
  });

  againBtn.addEventListener('click', () => {
    clueScreen.style.display = 'none';
    topBanner.style.display = 'block';
    resetSequence();
    scanHint.classList.add('show');
  });
})();
</script>
</body>
</html>
