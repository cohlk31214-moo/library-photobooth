<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>看不見的圖書館</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Noto Sans TC',sans-serif;}

#G{position:fixed;top:0;left:0;right:0;bottom:0;}

/* HUD */
#HUD{position:fixed;top:0;left:0;right:0;height:38px;
  background:rgba(8,12,28,.92);border-bottom:1px solid rgba(100,180,255,.2);
  display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100;}
.ht{font-size:12px;font-weight:900;color:#7fffd4;letter-spacing:1px;flex:1;}
.hi{background:rgba(255,255,255,.08);border:1px solid rgba(100,180,255,.25);
  border-radius:6px;padding:2px 10px;font-size:11px;color:#e8e8ff;
  display:none;align-items:center;gap:4px;}
.hc{background:#f4c430;color:#000;border-radius:99px;min-width:15px;height:15px;
  font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 2px;}

/* MAP */
#MAP{position:fixed;top:38px;left:0;right:0;bottom:0;}
#CV{position:absolute;top:0;left:0;}

/* STATUS */
#ST{position:absolute;top:6px;right:10px;font-size:10px;color:#7fffd4;z-index:20;
  background:rgba(0,0,0,.65);padding:2px 8px;border-radius:4px;}

/* DIALOG */
#DLG{position:absolute;bottom:0;left:0;right:0;
  background:rgba(6,10,24,.96);border-top:2px solid rgba(80,160,255,.5);
  padding:12px 16px 10px;z-index:60;display:none;
  animation:su .22s ease;}
@keyframes su{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.dspk{font-size:10px;font-weight:900;color:#7fffd4;letter-spacing:1px;margin-bottom:6px;}
.dtxt{font-size:13px;color:rgba(255,255,255,.92);line-height:1.8;min-height:44px;}
.dtap{text-align:right;font-size:10px;color:rgba(255,255,255,.25);margin-top:5px;animation:bk 1.2s infinite;}
@keyframes bk{50%{opacity:0}}

/* OPAC POV */
#OPAC{position:absolute;top:0;left:0;right:0;bottom:0;background:#f0f0f0;z-index:80;
  display:none;flex-direction:column;}
#OPAC.show{display:flex;}
.bb{background:#3c3c3c;padding:6px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.bds{display:flex;gap:4px;}
.bd{width:9px;height:9px;border-radius:50%;}
.bu{flex:1;background:#555;border-radius:3px;padding:3px 8px;font-size:10px;color:#ddd;font-family:monospace;}
.oh{background:#1a1a2e;padding:8px 14px 12px;flex-shrink:0;}
.ol{font-size:13px;font-weight:900;color:#fff;}
.ol span{display:block;font-size:9px;font-weight:400;color:#aaa;}
.ots{display:flex;gap:2px;margin:8px 0;}
.ot{font-size:11px;padding:4px 9px;border-radius:3px 3px 0 0;color:#aaa;background:rgba(255,255,255,.05);}
.ot.ac{background:#fff;color:#1a1a1a;font-weight:700;}
.or{display:flex;background:#fff;border-radius:5px;overflow:hidden;}
.oi{flex:1;border:none;padding:9px 12px;font-size:13px;font-family:'Noto Sans TC',sans-serif;outline:none;color:#1a1a1a;}
.ob{background:#e07b00;color:#fff;border:none;padding:9px 14px;font-size:12px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}
.tw{display:flex;align-items:center;gap:6px;margin-top:7px;}
.tl{font-size:10px;color:rgba(255,255,255,.6);}
.ts{position:relative;}
.tb{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:3px;
  padding:4px 9px;font-size:11px;color:#fff;cursor:pointer;font-family:'Noto Sans TC',sans-serif;
  display:flex;align-items:center;gap:3px;transition:all .15s;}
.tb.pulse{border-color:#e07b00;animation:tp 1.5s infinite;}
@keyframes tp{0%,100%{box-shadow:0 0 0 0 rgba(224,123,0,.4)}50%{box-shadow:0 0 0 5px rgba(224,123,0,0)}}
.td{position:absolute;top:calc(100% + 3px);left:0;background:#fff;border:1px solid #ddd;
  border-radius:4px;box-shadow:0 3px 16px rgba(0,0,0,.2);z-index:200;min-width:130px;overflow:hidden;}
.td.h{display:none;}
.to{padding:9px 12px;font-size:12px;cursor:pointer;color:#1a1a1a;border-bottom:1px solid #f0f0f0;transition:background .1s;}
.to:last-child{border:none;}
.to:hover{background:#e8f5f1;}
.to.gd{color:#2d6a4f;font-weight:700;}
.obdy{background:#fff;flex:1;padding:10px 14px;overflow-y:auto;}
.opr{text-align:center;padding:30px 16px;color:#666;font-size:13px;line-height:1.8;}
.opi{font-size:32px;display:block;margin-bottom:8px;}
.rh{font-size:11px;color:#666;padding:6px 0;border-bottom:1px solid #eee;margin-bottom:8px;}
.rc{color:#2d6a4f;font-weight:700;}
.ri{border:1px solid #eee;border-radius:5px;padding:10px;margin-bottom:7px;cursor:pointer;background:#fafafa;transition:all .15s;}
.ri:hover{border-color:#00785a;background:#e8f5f1;}
.ri.tg{border-left:3px solid #00785a;}
.rit{font-size:13px;font-weight:700;color:#1a5fa8;}
.ria{font-size:11px;color:#666;margin-top:2px;}
.rtgs{margin-top:4px;display:flex;gap:3px;}
.rtg{font-size:9px;padding:1px 6px;border-radius:99px;background:#eee;color:#555;}
.rtg.eb{background:#e8f5f1;color:#2d6a4f;font-weight:700;}
.al{border-radius:6px;padding:9px 12px;font-size:12px;margin-bottom:8px;line-height:1.5;}
.al.w{background:#fff8ee;border:1px solid #f0d070;color:#7a5a00;}
.al.e{background:#fdecea;border:1px solid #f5c6c6;color:#7a1a1a;}
.al.ok{background:#e8f5e9;border:1px solid #a5d6a7;color:#1a4a2a;}
.bk{background:#1a1a2e;color:#fff;border:none;border-radius:5px;padding:9px;
  font-size:12px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;
  margin:0 14px 12px;width:calc(100% - 28px);}

/* TREASURE */
#TR{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;
  align-items:center;justify-content:center;padding:16px;}
#TR.show{display:flex;}
.trc{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);border:2px solid #f4c430;
  border-radius:14px;padding:20px 18px;max-width:310px;width:100%;text-align:center;
  animation:pi .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes pi{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.trb{font-size:9px;font-weight:700;letter-spacing:3px;color:#f4c430;margin-bottom:6px;}
.tri{font-size:48px;margin-bottom:8px;animation:fl 2s ease-in-out infinite;}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.trn{font-size:18px;font-weight:900;color:#fff;margin-bottom:6px;}
.trd{font-size:12px;color:#aaa;line-height:1.7;margin-bottom:12px;white-space:pre-line;}
.qw{background:#fff;border-radius:8px;padding:10px;display:inline-block;margin-bottom:12px;}
.ql{font-size:10px;color:#555;margin-top:4px;}
.tbt{background:#f4c430;color:#1a1a00;border:none;border-radius:6px;padding:10px 32px;
  font-size:13px;font-weight:900;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}

/* DPAD */
#DP{position:absolute;bottom:12px;left:12px;z-index:30;}
.dg{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px;}
.db{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;
  font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s;}
.db:active{background:rgba(255,255,255,.3);}
.de{background:transparent;border-color:transparent;pointer-events:none;}
#AB{position:absolute;bottom:18px;right:14px;width:60px;height:60px;z-index:30;
  background:rgba(127,255,212,.12);border:2px solid #7fffd4;border-radius:50%;
  font-size:10px;font-weight:900;color:#7fffd4;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
#AB:active{background:rgba(127,255,212,.32);}
</style>
</head>
<body>
<div id="G">
  <!-- HUD -->
  <div id="HUD">
    <div class="ht">🏛️ 看不見的圖書館</div>
    <div class="hi" id="HI">🎒 <span class="hc" id="HC">0</span></div>
  </div>

  <!-- MAP -->
  <div id="MAP">
    <canvas id="CV"></canvas>
    <div id="ST">靠近物件按【互動】</div>

    <!-- DPAD -->
    <div id="DP">
      <div class="dg">
        <div class="de"></div>
        <div class="db" onpointerdown="mv('up')" onpointerup="sm()" onpointercancel="sm()">▲</div>
        <div class="de"></div>
        <div class="db" onpointerdown="mv('left')" onpointerup="sm()" onpointercancel="sm()">◀</div>
        <div class="de"></div>
        <div class="db" onpointerdown="mv('right')" onpointerup="sm()" onpointercancel="sm()">▶</div>
        <div class="de"></div>
        <div class="db" onpointerdown="mv('down')" onpointerup="sm()" onpointercancel="sm()">▼</div>
        <div class="de"></div>
      </div>
    </div>
    <div id="AB" onpointerdown="act()">互動</div>

    <!-- DIALOG -->
    <div id="DLG">
      <div class="dspk" id="DSP"></div>
      <div class="dtxt" id="DTX"></div>
      <div class="dtap">▼ 點此繼續</div>
    </div>

    <!-- OPAC POV -->
    <div id="OPAC">
      <div class="bb">
        <div class="bds">
          <div class="bd" style="background:#ff5f57"></div>
          <div class="bd" style="background:#febc2e"></div>
          <div class="bd" style="background:#28c840"></div>
        </div>
        <div class="bu" id="BU">book.tpml.edu.tw</div>
      </div>
      <div class="oh">
        <div class="ol">臺北市立圖書館<span>館藏查詢系統 / OPAC</span></div>
        <div class="ots">
          <div class="ot ac">簡易查詢</div>
          <div class="ot">進階查詢</div>
          <div class="ot">分館查詢</div>
        </div>
        <div class="or">
          <input type="text" class="oi" id="OQ" placeholder="請輸入關鍵字文字">
          <button class="ob" onclick="doSearch()">查詢</button>
        </div>
        <div class="tw">
          <span class="tl">類型：</span>
          <div class="ts">
            <button class="tb pulse" id="TB" onclick="togDD()"><span id="TL">全部類型</span> ▾</button>
            <div class="td h" id="TD">
              <div class="to" onclick="pickT('圖書')">圖書</div>
              <div class="to" onclick="pickT('期刊')">期刊</div>
              <div class="to" onclick="pickT('視聽資料')">視聽資料</div>
              <div class="to gd" onclick="pickT('電子資源')">電子資源 ← 選這個！</div>
            </div>
          </div>
        </div>
      </div>
      <div class="obdy" id="OBD">
        <div class="opr">
          <span class="opi">💡</span>
          <strong>館員提示</strong><br>
          先把「全部類型」切換成<br>「<strong>電子資源</strong>」再輸入書名！
        </div>
      </div>
      <button class="bk" onclick="closeOpac()">← 返回圖書館</button>
    </div>
  </div>
</div>

<!-- TREASURE -->
<div id="TR">
  <div class="trc">
    <div class="trb">✦ 獲得道具 ✦</div>
    <div class="tri" id="TRI"></div>
    <div class="trn" id="TRN"></div>
    <div class="trd" id="TRD"></div>
    <div class="qw"><canvas id="QRC" width="110" height="110"></canvas><div class="ql" id="QRL"></div></div>
    <button class="tbt" onclick="closeTR()">收入背包 →</button>
  </div>
</div>

// ══ QR ══
function drawQR(cv,url){
  const ct=cv.getContext('2d'),sz=110,n=21,cs=sz/n;
  ct.fillStyle='#fff';ct.fillRect(0,0,sz,sz);ct.fillStyle='#000';
  let s=0;for(let i=0;i<url.length;i++)s=(s*31+url.charCodeAt(i))&0xffffffff;
  function r(){s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;}
  function f(x,y){ct.fillRect(x*cs,y*cs,7*cs,7*cs);ct.fillStyle='#fff';ct.fillRect((x+1)*cs,(y+1)*cs,5*cs,5*cs);ct.fillStyle='#000';ct.fillRect((x+2)*cs,(y+2)*cs,3*cs,3*cs);}
  f(0,0);f(14,0);f(0,14);
  for(let row=0;row<n;row++)for(let col=0;col<n;col++){
    if((row<8&&col<8)||(row<8&&col>12)||(row>12&&col<8))continue;
    if(r()>0.48)ct.fillRect(col*cs,row*cs,cs,cs);
  }
}

// 互動物件（座標對應背景圖中各物件位置）
// 布告欄(右中)、服務台(右下)、電腦(左中)、展示柱(中央)
const OBJS=[
  {id:'notice', tx:21,ty:10, label:'📋 E起暢讀電子書 布告欄', done:false},
  {id:'counter',tx:27,ty:13, label:'👩‍💼 服務台館員',           done:false},
  {id:'pc',     tx:5, ty:5,  label:'🖥️ 館藏查詢電腦',           done:false},
  {id:'kiosk',  tx:15,ty:6,  label:'📱 電子書展示台',           done:false},
];

// ── 狀態 ──
let P={tx:14,ty:12,face:'up'};
let camX=0,camY=0,canMove=true,dlgOn=false;
let dlgQ=[],trCB=null,itmCnt=0,af=0,typeOK=false,cSt=0,mIv=null;
let cv,ctx,vW,vH;

// ── INIT ──
function init(){
  cv=document.getElementById('CV');
  const map=document.getElementById('MAP');
  vW=map.clientWidth||window.innerWidth;
  vH=map.clientHeight||(window.innerHeight-38);
  cv.width=vW; cv.height=vH;
  ctx=cv.getContext('2d');
  window.addEventListener('resize',()=>{
    const m=document.getElementById('MAP');
    vW=m.clientWidth||window.innerWidth;
    vH=m.clientHeight||(window.innerHeight-38);
    cv.width=vW; cv.height=vH;
    ctx=cv.getContext('2d');
  });
}

// ── RENDER ──
function loop(){
  requestAnimationFrame(loop);
  if(!ctx)return;
  ctx.clearRect(0,0,vW,vH);
  updCam();

  // 背景
  if(bgOK){
    ctx.drawImage(BG,-camX,-camY,MW*TW,MH*TH);
  } else {
    // Fallback：深藍背景 + 格線（跟背景圖顏色接近）
    ctx.fillStyle='#0d1b4a';
    ctx.fillRect(0,0,vW,vH);
    ctx.strokeStyle='rgba(80,120,200,.15)';
    for(let x=0;x<vW;x+=TW){ctx.beginPath();ctx.moveTo(x-camX%TW,0);ctx.lineTo(x-camX%TW,vH);ctx.stroke();}
    for(let y=0;y<vH;y+=TH){ctx.beginPath();ctx.moveTo(0,y-camY%TH);ctx.lineTo(vW,y-camY%TH);ctx.stroke();}
    ctx.fillStyle='rgba(127,255,212,.6)';ctx.font='14px sans-serif';
    ctx.textAlign='center';ctx.fillText('圖片載入中…',vW/2,vH/2);ctx.textAlign='left';
  }

  // 光暈
  OBJS.forEach(o=>{
    if(o.done)return;
    const sx=o.tx*TW-camX,sy=o.ty*TH-camY;
    const g=ctx.createRadialGradient(sx+20,sy+20,2,sx+20,sy+20,28);
    g.addColorStop(0,`rgba(127,255,212,${.2+.12*Math.sin(af*.08)})`);
    g.addColorStop(1,'rgba(127,255,212,0)');
    ctx.fillStyle=g;ctx.fillRect(sx-14,sy-14,TW+28,TH+28);
  });

  // 玩家
  drawP();

  // 提示
  const n=getNear();
  if(n&&!dlgOn){
    const sx=n.tx*TW-camX,sy=n.ty*TH-camY;
    ctx.fillStyle='rgba(0,0,0,.78)';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(sx-4,sy-24,TW+8,16,3);
    else ctx.rect(sx-4,sy-24,TW+8,16);
    ctx.fill();
    ctx.fillStyle='#7fffd4';ctx.font='bold 9px Noto Sans TC';
    ctx.textAlign='center';ctx.fillText('按【互動】',sx+TW/2,sy-12);ctx.textAlign='left';
    document.getElementById('ST').textContent='靠近：'+n.label;
  } else if(!dlgOn){
    document.getElementById('ST').textContent='靠近物件按【互動】';
  }
  af++;
}

function updCam(){
  const tx=P.tx*TW-vW/2+20, ty=P.ty*TH-vH/2+20;
  const mxX=Math.max(0,MW*TW-vW), mxY=Math.max(0,MH*TH-vH);
  camX+=(Math.max(0,Math.min(mxX,tx))-camX)*.12;
  camY+=(Math.max(0,Math.min(mxY,ty))-camY)*.12;
}

function drawP(){
  const sx=P.tx*TW-camX, sy=P.ty*TH-camY;
  const bo=canMove?Math.sin(af*.1)*2:0;
  // 陰影
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(sx+TW/2,sy+TH-2,12,4,0,0,Math.PI*2);ctx.fill();
  if(plOK){
    const ph=TH*1.9,pw=ph*(PL.width/PL.height);
    const dx=sx+TW/2-pw/2, dy=sy+TH-ph+bo;
    if(P.face==='left'){
      ctx.save();ctx.translate(dx+pw,dy);ctx.scale(-1,1);ctx.drawImage(PL,0,0,pw,ph);ctx.restore();
    } else {
      ctx.drawImage(PL,dx,dy,pw,ph);
    }
  } else {
    ctx.font=(TW-2)+'px serif';
    ctx.fillText('🧑',sx+4,sy+TH-4+bo);
  }
}

// ── 碰撞 ──
function canWalk(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH)return false;
  if(MAP[ty][tx]===1)return false;
  if(OBJS.some(o=>o.tx===tx&&o.ty===ty))return false;
  return true;
}

// ── 移動 ──
function mv(d){if(mIv)return;doMv(d);mIv=setInterval(()=>doMv(d),170);}
function sm(){clearInterval(mIv);mIv=null;}
function doMv(d){
  if(!canMove||dlgOn)return;
  let nx=P.tx,ny=P.ty;P.face=d;
  if(d==='up')ny--;if(d==='down')ny++;if(d==='left')nx--;if(d==='right')nx++;
  if(canWalk(nx,ny)){P.tx=nx;P.ty=ny;}
}
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){e.preventDefault();mv(m[e.key]);}
  if(['Space','Enter','z','Z'].includes(e.code)){e.preventDefault();act();}
});
document.addEventListener('keyup',()=>sm());

// ── 互動 ──
function getNear(){return OBJS.find(o=>Math.abs(P.tx-o.tx)<=2&&Math.abs(P.ty-o.ty)<=1)||null;}
function act(){if(dlgOn){nextD();return;}const n=getNear();if(n)interact(n);}
function interact(o){
  if(o.id==='notice')doNotice(o);
  else if(o.id==='counter')doCounter(o);
  else if(o.id==='pc')doPC(o);
  else if(o.id==='kiosk')doKiosk(o);
}

// ── 對話 ──
function showD(lines){dlgQ=[...lines];dlgOn=true;canMove=false;nextD();}
let tTmr=null;
function nextD(){
  if(dlgQ.length===0){closeD();return;}
  const l=dlgQ.shift();
  document.getElementById('DSP').textContent=l.sp||'';
  const el=document.getElementById('DTX'); el.textContent='';
  if(tTmr)clearInterval(tTmr);
  let i=0;
  tTmr=setInterval(()=>{
    el.textContent+=l.tx[i];i++;
    if(i>=l.tx.length){clearInterval(tTmr);tTmr=null;if(l.cb)l.cb();}
  },18);
  document.getElementById('DLG').style.display='block';
  document.getElementById('DLG').onclick=nextD;
}
function closeD(){document.getElementById('DLG').style.display='none';dlgOn=false;canMove=true;dlgQ=[];}

// ── OPAC ──
function openOpac(){closeD();document.getElementById('OPAC').classList.add('show');canMove=false;}
function closeOpac(){document.getElementById('OPAC').classList.remove('show');canMove=true;}
document.addEventListener('click',e=>{if(!e.target.closest('.ts'))document.getElementById('TD').classList.add('h');});
function togDD(){document.getElementById('TD').classList.toggle('h');}
function pickT(t){
  document.getElementById('TD').classList.add('h');
  document.getElementById('TL').textContent=t;
  const b=document.getElementById('TB');
  if(t==='電子資源'){
    typeOK=true;b.classList.remove('pulse');

}
function doSearch(){
  const q=document.getElementById('OQ').value.trim();

// ── TREASURE ──
function showTR(ico,name,desc,lbl,url,cb){
  document.getElementById('TRI').textContent=ico;
