<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>動線導引 AR - 館藏特色區說明</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000; font-family: sans-serif;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; padding: 18px 36px; font-size: 20px; font-weight: bold;
    background: #ff2d78; color: #fff; border: none; border-radius: 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 15; color: #fff; background: rgba(0,0,0,0.55); padding: 8px 16px;
    border-radius: 20px; font-size: 14px; display: none;
  }
  #statusBox {
    position: fixed; top: 8px; left: 8px; z-index: 998;
    color: #0f0; background: rgba(0,0,0,0.6); padding: 6px 10px;
    border-radius: 8px; font-size: 12px; font-family: monospace;
  }
  #errBox {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: rgba(255,0,0,0.85); color: #fff; font-size: 12px;
    padding: 8px; display: none; white-space: pre-wrap; word-break: break-all;
  }
  video:not(.assetVideo) {
    position: fixed !important; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
    object-fit: cover; z-index: 1 !important;
  }
  canvas {
    position: fixed !important; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
    z-index: 2 !important;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<button id="startBtn">點擊開始 AR 導覽</button>
<div id="hint">請將鏡頭對準指標圖片</div>
<div id="statusBox">狀態: 尚未啟動</div>
<div id="errBox"></div>

<script>
  function showErr(msg) {
    var box = document.getElementById("errBox");
    box.style.display = "block";
    box.textContent = "錯誤: " + msg;
  }
  window.addEventListener("error", function (e) {
    showErr(e.message + " (" + e.filename + ":" + e.lineno + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = (reason && (reason.message || reason.toString())) || String(reason);
    showErr("[非同步] " + msg);
  });
</script>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

let mindarThree = null;
let started = false;

function setStatus(msg) {
  const box = document.getElementById("statusBox");
  if (box) box.textContent = "狀態: " + msg;
}

// 逐行文字素材(6行，每行各自獨立檔案，含emoji與去白底底色板)
const LINES = [
  { file: "./wayfinding-station4-msg1.png", pixelWidth: 1089 },
  { file: "./wayfinding-station4-msg2.png", pixelWidth: 1081 },
  { file: "./wayfinding-station4-msg3.png", pixelWidth: 611 },
  { file: "./wayfinding-station4-msg4.png", pixelWidth: 965 },
  { file: "./wayfinding-station4-msg5.png", pixelWidth: 1702 },
  { file: "./wayfinding-station4-msg6.png", pixelWidth: 1045 },
];
const LINE_PIXEL_HEIGHT = 105;

// 強制修正MindAR產生的攝影機畫面/畫布，避免任何外層容器造成的黑邊
function forceFullscreenFix() {
  function apply(el) {
    el.style.setProperty("position", "fixed", "important");
    el.style.setProperty("top", "0", "important");
    el.style.setProperty("left", "0", "important");
    el.style.setProperty("width", "100vw", "important");
    el.style.setProperty("height", "100vh", "important");
    el.style.setProperty("max-width", "none", "important");
    el.style.setProperty("max-height", "none", "important");
    el.style.setProperty("transform", "none", "important");
    el.style.setProperty("object-fit", "cover", "important");
  }
  const video = document.querySelector("video:not(.assetVideo)");
  const canvas = document.querySelector("canvas");
  [video, canvas].forEach((el) => {
    if (!el) return;
    apply(el);
    let node = el.parentElement;
    while (node && node !== document.body) {
      node.style.setProperty("transform", "none", "important");
      node.style.setProperty("position", "static", "important");
      node.style.setProperty("width", "100%", "important");
      node.style.setProperty("height", "100%", "important");
      node.style.setProperty("max-width", "none", "important");
      node = node.parentElement;
    }
  });
}

// ---- 版面參數 ----
// 整組文字「最上面那一行」的世界座標高度：對應「貼近天花板」的位置
// 世界單位跟實際公分沒有直接換算關係(MindAR沒有做真實世界比例校正)，
// 這個數字是憑經驗抓的高位置，實際高度請以現場測試為準，再跟我說要往上/往下調
const REVEAL_INTERVAL_MS = 1200; // 每一行「開始」滑入的間隔（含前一行動畫時間）
const ANIM_DURATION_MS = 500; // 單行滑入動畫時長
const SLIDE_DISTANCE = 0.25; // 滑入前，文字在最終位置下方多遠的地方
const PAUSE_AFTER_COMPLETE_MS = 3000; // 全部6行都顯示完畢後，停留多久再重新整個循環

function easeOutQuad(t) {
  return 1 - (1 - t) * (1 - t);
}
function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}
function animateLine(item, duration) {
  return new Promise((resolve) => {
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = easeOutQuad(t);
      item.mesh.position.y = item.fromY + (item.toY - item.fromY) * eased;
      item.material.opacity = eased;
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}
function resetLine(item) {
  item.mesh.position.y = item.fromY;
  item.material.opacity = 0;
}

// ---- 版面參數 ----
// 整組文字「最上面那一行」的世界座標高度：對應「貼近天花板」的位置
// 世界單位跟實際公分沒有直接換算關係，這個數字是憑經驗抓的高位置，
// 實際高度請以現場測試為準，再跟我說要往上/往下調
const TOP_Y = 0.9;
const WORLD_LINE_HEIGHT = 0.16; // 每一行文字的世界高度
const LINE_GAP = 0.05; // 行與行之間的間距

async function startAR() {
  if (started) return;
  started = true;

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("hint").style.display = "block";
  setStatus("初始化 MindAR...");

  mindarThree = new MindARThree({
    container: document.body,
    imageTargetSrc: "./wayfinding-station4-targets.mind",
    filterMinCF: 0.00005,
    filterBeta: 0.0005,
    uiScanning: false,
  });

  const { renderer, scene, camera } = mindarThree;
  renderer.setClearColor(0x000000, 0);

  // ---- 預先載入6行文字圖，各自建立獨立mesh，初始位置在最終位置下方、完全透明 ----
  const textureLoader = new THREE.TextureLoader();
  const textures = await Promise.all(LINES.map((l) => textureLoader.loadAsync(l.file)));
  textures.forEach((t) => (t.colorSpace = THREE.SRGBColorSpace));

  const anchor = mindarThree.addAnchor(0);

  const lineMeshes = LINES.map((lineInfo, i) => {
    const aspect = lineInfo.pixelWidth / LINE_PIXEL_HEIGHT;
    const w = WORLD_LINE_HEIGHT * aspect;
    const h = WORLD_LINE_HEIGHT;
    const finalY = TOP_Y - i * (WORLD_LINE_HEIGHT + LINE_GAP) - WORLD_LINE_HEIGHT / 2;

    const geometry = new THREE.PlaneGeometry(w, h);
    const material = new THREE.MeshBasicMaterial({
      map: textures[i],
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(0, finalY - SLIDE_DISTANCE, 0);
    anchor.group.add(mesh);

    return { mesh, material, fromY: finalY - SLIDE_DISTANCE, toY: finalY };
  });

  let sequenceRunning = false;

  async function playSequence() {
    if (sequenceRunning) return;
    sequenceRunning = true;
    while (true) {
      lineMeshes.forEach(resetLine);
      for (const item of lineMeshes) {
        await animateLine(item, ANIM_DURATION_MS);
        await sleep(Math.max(0, REVEAL_INTERVAL_MS - ANIM_DURATION_MS));
      }
      await sleep(PAUSE_AFTER_COMPLETE_MS);
    }
  }

  anchor.onTargetFound = () => {
    document.getElementById("hint").style.display = "none";
    setStatus("已偵測到目標，逐行顯示中");
    playSequence();
  };
  anchor.onTargetLost = () => {
    document.getElementById("hint").style.display = "block";
    setStatus("鏡頭運作中，掃描目標中...");
  };

  try {
    await mindarThree.start();
    setStatus("鏡頭運作中，掃描目標中...");
    forceFullscreenFix();
    setTimeout(forceFullscreenFix, 300);
    setTimeout(forceFullscreenFix, 1000);
    window.addEventListener("resize", forceFullscreenFix);
    window.addEventListener("orientationchange", forceFullscreenFix);
  } catch (err) {
    showErr("[MindAR啟動失敗] " + (err && (err.message || err.toString())));
    setStatus("啟動失敗");
    document.getElementById("startBtn").style.display = "block";
    document.getElementById("hint").style.display = "none";
    started = false;
    return;
  }

  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });
}

document.getElementById("startBtn").addEventListener("click", startAR);
</script>

</body>
</html>
